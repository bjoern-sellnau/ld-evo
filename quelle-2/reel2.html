<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Björn Sellnau — Reel 2</title>
<link rel="stylesheet" href="fonts.css" />
<style>html,body{margin:0;background:#000}canvas{display:block;width:540px;height:960px}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* Reel 2 „Björn Sellnau“ — länger, mehr Action. 1080×1920, 30 fps, 124 BPM.
   Fakten: loona-designs.de (Startseite, Über mich, Portfolio), github.com/bjoern-sellnau (Profil, Repos),
   eigene Spiele Corefall & Covert Operations (gh-pages, lokal aufgenommen), neue Website (content/*.ts). */
const W = 1080, H = 1920;
const BPM = 124, B = 60 / BPM, BAR = 4 * B;
const DUR = 40 * BAR + 2.2;
const cv = document.getElementById('c');
let g = cv.getContext('2d');
let inTrans = false;
const C = { bg: '#06080D', ink: '#F2F5FA', soft: '#9AA7BA', mute: '#5F6B7E', amber: '#FFB224', orange: '#FF7A2F', deep: '#FF7816', tileInk: '#171310', cyan: '#5EEAD4', violet: '#C4B5FD', red: '#FF3B5C' };
const SG = '"Space Grotesk"', IS = '"Instrument Sans"', JM = '"JetBrains Mono"';

/* ---------- Helfer ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (x) => 1 - Math.pow(1 - x, 3);
const eOut5 = (x) => 1 - Math.pow(1 - x, 5);
const eIn = (x) => x * x * x;
const eIO = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const eElastic = (x) => (x === 0 || x === 1 ? x : Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * (2 * Math.PI) / 3) + 1);
const hash = (n) => { const s = Math.sin(n * 127.1 + 0.3) * 43758.5453; return s - Math.floor(s); };
const bar = (n) => n * BAR;
const beatPh = (t) => ((t % B) + B) % B;
const pulse = (t, k = 7) => Math.exp(-beatPh(t) * k);
const sinceHit = (t, hits) => { let d = 99; for (const h of hits) if (t >= h) d = Math.min(d, t - h); return d; };

function font(size, weight = 700, fam = SG) { return `${weight} ${size}px ${fam}`; }
function text(str, x, y, o = {}) {
  g.save();
  g.font = font(o.size ?? 64, o.weight ?? 700, o.fam ?? SG);
  g.textAlign = o.align ?? 'left'; g.textBaseline = o.base ?? 'alphabetic';
  g.globalAlpha *= o.alpha ?? 1;
  if ('letterSpacing' in g) g.letterSpacing = (o.ls ?? 0) + 'px';
  if (o.glow) { g.shadowColor = o.glow; g.shadowBlur = o.glowSize ?? 30; }
  if (o.stroke) { g.strokeStyle = o.stroke; g.lineWidth = o.lw ?? 3; g.strokeText(str, x, y); }
  else { g.fillStyle = o.color ?? C.ink; g.fillText(str, x, y); }
  g.restore();
}
function measure(str, size, weight = 700, fam = SG, ls = 0) {
  g.save(); g.font = font(size, weight, fam); if ('letterSpacing' in g) g.letterSpacing = ls + 'px';
  const w = g.measureText(str).width; g.restore(); return w;
}
function fit(str, max, size, weight = 700, fam = SG, ls = 0) { while (size > 10 && measure(str, size, weight, fam, ls) > max) size -= 4; return size; }
/* RGB-Split-Text: Rot/Cyan versetzt, oben weiß */
function rgbText(str, x, y, o = {}, amt = 0) {
  if (amt > 0.5) {
    g.save(); g.globalCompositeOperation = 'lighter';
    text(str, x - amt, y, { ...o, color: 'rgba(255,40,80,0.8)', stroke: undefined });
    text(str, x + amt, y, { ...o, color: 'rgba(40,220,255,0.8)', stroke: undefined });
    g.restore();
  }
  text(str, x, y, o);
}
/* Scramble/Decode: Zeichen lösen sich aus Zufallszeichen auf */
const GLY = '01#$%&*+<>/\\=?@ABCDEFGHJKLMNPRSTUVWXYZ';
function scramble(str, p, seed = 0, tick = 0) {
  const n = str.length; let out = '';
  for (let i = 0; i < n; i++) {
    const ch = str[i];
    if (ch === ' ') { out += ' '; continue; }
    const at = (i / n) * 0.85; // bei p = 1 sind alle Zeichen aufgelöst
    out += p >= at + 0.15 ? ch : p > at - 0.1 ? GLY[Math.floor(hash(seed + i * 7 + tick) * GLY.length)] : ' ';
  }
  return out;
}
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function imgCover(img, x, y, w, h, r = 0, top = false, zoom = 1, px = 0.5, py = 0.5) {
  if (!img) return;
  const s = Math.max(w / img.width, h / img.height) * zoom;
  const iw = img.width * s, ih = img.height * s;
  g.save(); rr(x, y, w, h, r); g.clip();
  g.drawImage(img, x + (w - iw) * px, top ? y : y + (h - ih) * py, iw, ih);
  g.restore();
}
const GLYPH = [new Path2D('M0 3H8V35H19L22 43H0Z'), new Path2D('M11 3H24A20 20 0 0 1 24 43H25L19 27H16V11H11ZM21 11H24A12 12 0 0 1 24 35L21 27Z')];
function ldTile(cx, cy, size, bgc = C.tileInk, fg = C.deep, alpha = 1) {
  const s = size / 64;
  g.save(); g.globalAlpha *= alpha; g.translate(cx - size / 2, cy - size / 2); g.scale(s, s);
  g.fillStyle = bgc; rr(0, 0, 64, 64, 14); g.fill();
  g.translate(9.6, 12.6); g.scale(1.018, 1.018); g.fillStyle = fg; g.fill(GLYPH[0]); g.fill(GLYPH[1], 'evenodd');
  g.restore();
}
function kicker(str, x, y, a = 1, col = C.amber, align = 'left') { text(str, x, y, { size: 30, weight: 500, fam: JM, color: col, ls: 6, alpha: a, align }); }

/* Bilder */
const IMG = {};
const SRC = {
  yayci: 'assets/old_yayci.webp', ld2006: 'assets/old_ld2006.webp', catt: 'assets/old_catt2005.webp', hanno: 'assets/old_hannoback.webp',
  mobHome: 'assets/mob_home.png', mobStory: 'assets/mob_story.png', mobBeyond: 'assets/mob_ldbeyond.png',
  deskAurum: 'assets/desk_aurum.png', deskViola: 'assets/desk_viola.png', deskLabs: 'assets/desk_labs.png',
  cfTitle: 'assets/g_core-fall-menu.jpg', cfPilot: 'assets/g_cf-step2.jpg', cfThreat: 'assets/g_cf-step3.jpg', cfMission: 'assets/g_cf-step4.jpg',
  coSplash: 'assets/g_co-step2.jpg', coBoot: 'assets/g_co-step4.jpg', coModes: 'assets/g_co-q1.jpg', coTitle: 'assets/g_co-menu.jpg',
};
const PLAY = ['00', '01', '02', '13', '14', '15', '16', '18', '19', '06'];
PLAY.forEach((n) => (SRC['cf' + n] = `assets/g_cf-play${n}.jpg`));
const loadAll = () => Promise.all(Object.entries(SRC).map(([k, s]) => new Promise((res) => { const i = new Image(); i.onload = () => { IMG[k] = i; res(); }; i.onerror = () => res(); i.src = s; })));

const grain = document.createElement('canvas'); grain.width = grain.height = 256;
{ const gx = grain.getContext('2d'); const d = gx.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.floor(hash(i * 0.37 + 1) * 255); d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  gx.putImageData(d, 0, 0); }
const buf = document.createElement('canvas'); buf.width = W; buf.height = H; const bx = buf.getContext('2d');

/* ---------- Effekte ---------- */
function background(t, warm = 1, hue = 'amber') {
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  const pal = { amber: [['255,122,47', 0.22], ['255,178,36', 0.15], ['190,24,93', 0.08]], violet: [['124,58,237', 0.24], ['236,72,153', 0.12], ['56,189,248', 0.1]], cyan: [['20,184,166', 0.2], ['56,189,248', 0.14], ['255,122,47', 0.06]], red: [['220,38,38', 0.24], ['255,122,47', 0.14], ['120,20,40', 0.12]] }[hue];
  pal.forEach(([c, a], i) => {
    const x = W * (0.5 + 0.4 * Math.sin(t * 0.23 + i * 2.1)), y = H * (0.45 + 0.35 * Math.cos(t * 0.19 + i * 1.7)), r = 760 + 180 * Math.sin(t * 0.31 + i);
    const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(${c},${a * warm})`); gr.addColorStop(1, `rgba(${c},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  });
  // Raster
  g.save(); g.globalAlpha = 0.05; g.strokeStyle = '#fff'; g.lineWidth = 1;
  const off = (t * 40) % 90;
  for (let y = -90 + off; y < H; y += 90) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  for (let x = 0; x < W; x += 90) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  g.restore();
  for (let i = 0; i < 80; i++) {
    const px = (hash(i) * W + t * (10 + hash(i + 9) * 30)) % W, py = (hash(i + 3) * H - t * (20 + hash(i + 5) * 50) + H * 20) % H;
    g.fillStyle = `rgba(255,214,150,${0.06 + 0.25 * hash(i + 7)})`; g.fillRect(px, py, 2 + hash(i + 1) * 3, 2 + hash(i + 1) * 3);
  }
}
function finish(t) {
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.78);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.6)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
  g.save(); g.globalAlpha = 0.08; g.globalCompositeOperation = 'overlay';
  const f = Math.floor(t * 30), ox = Math.floor(hash(f) * 256), oy = Math.floor(hash(f + 4) * 256);
  for (let y = -oy; y < H; y += 256) for (let x = -ox; x < W; x += 256) g.drawImage(grain, x, y);
  g.restore();
}
function glitch(amount, seed) {
  if (amount <= 0 || inTrans) return;
  bx.clearRect(0, 0, W, H); bx.drawImage(g.canvas, 0, 0);
  for (let i = 0; i < 16; i++) {
    const y = Math.floor(hash(seed + i) * H), h = 8 + Math.floor(hash(seed + i + 50) * 140 * amount), dx = (hash(seed + i + 99) - 0.5) * 260 * amount;
    g.drawImage(buf, 0, y, W, h, dx, y, W, h);
  }
  g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.35 * amount; g.drawImage(buf, 14 * amount, 0); g.drawImage(buf, -14 * amount, 0); g.restore();
  g.fillStyle = `rgba(255,122,47,${0.18 * amount})`; g.fillRect(0, Math.floor(hash(seed + 7) * H), W, 6 + 24 * amount);
}
function flash(a, col = '255,240,220') { if (a > 0 && !inTrans) { g.fillStyle = `rgba(${col},${Math.min(1, a)})`; g.fillRect(0, 0, W, H); } }
function shakeT(amp, t) { if (amp <= 0) return; g.translate((hash(Math.floor(t * 60)) - 0.5) * amp, (hash(Math.floor(t * 60) + 9) - 0.5) * amp); }
function shockwave(x, y, age, col = '255,190,90', max = 1300) {
  if (age < 0 || age > 0.9) return;
  const k = eOut(age / 0.9), r = 40 + max * k;
  g.save(); g.strokeStyle = `rgba(${col},${(1 - k) * 0.9})`; g.lineWidth = 30 * (1 - k) + 2;
  g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke(); g.restore();
}
function burst(x, y, age, seed, n = 60, col = '255,200,120') {
  if (age < 0 || age > 1.4) return;
  for (let i = 0; i < n; i++) {
    const a = hash(seed + i) * 6.283, v = 400 + hash(seed + i + 3) * 1300, d = v * age * (1 - age * 0.35);
    const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d + 260 * age * age;
    const s = (1 - age / 1.4) * (3 + hash(seed + i + 5) * 6);
    g.fillStyle = `rgba(${col},${1 - age / 1.4})`; g.fillRect(px, py, s, s);
  }
}
function speedLines(t, a, cx = W / 2, cy = H / 2) {
  if (a <= 0) return;
  g.save(); g.globalAlpha = a; g.strokeStyle = 'rgba(255,230,190,0.5)';
  for (let i = 0; i < 60; i++) {
    const ang = hash(i) * 6.283, r0 = 300 + ((t * 2400 + hash(i + 1) * 1600) % 1600), len = 80 + hash(i + 2) * 260;
    g.lineWidth = 1 + hash(i + 3) * 3;
    g.beginPath(); g.moveTo(cx + Math.cos(ang) * r0, cy + Math.sin(ang) * r0); g.lineTo(cx + Math.cos(ang) * (r0 + len), cy + Math.sin(ang) * (r0 + len)); g.stroke();
  }
  g.restore();
}
function brackets(x, y, w, h, col = C.amber, a = 1, s = 40) {
  g.save(); g.globalAlpha = a; g.strokeStyle = col; g.lineWidth = 4;
  [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]].forEach(([px, py, dx, dy]) => { g.beginPath(); g.moveTo(px, py + dy * s); g.lineTo(px, py); g.lineTo(px + dx * s, py); g.stroke(); });
  g.restore();
}
function scanlines(a = 0.12) { g.save(); g.globalAlpha = a; g.fillStyle = '#000'; for (let y = 0; y < H; y += 6) g.fillRect(0, y, W, 2); g.restore(); }
/* Monitor mit Spielbild + HUD */
function monitor(img, cx, cy, w, t, o = {}) {
  const h = w * (o.aspect ?? 9 / 16);
  g.save(); g.translate(cx, cy); if (o.rot) g.rotate(o.rot); g.scale(o.scale ?? 1, o.scale ?? 1);
  g.shadowColor = o.glowCol ?? 'rgba(255,122,47,0.45)'; g.shadowBlur = 70;
  g.fillStyle = '#000'; rr(-w / 2 - 10, -h / 2 - 10, w + 20, h + 20, 22); g.fill(); g.shadowBlur = 0;
  imgCover(img, -w / 2, -h / 2, w, h, 14, false, o.zoom ?? 1, o.px ?? 0.5, o.py ?? 0.5);
  if (o.rgb) { g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.25 * o.rgb; imgCover(img, -w / 2 + 10 * o.rgb, -h / 2, w, h, 14, false, o.zoom ?? 1, o.px ?? 0.5, o.py ?? 0.5); g.restore(); }
  g.strokeStyle = 'rgba(255,255,255,0.18)'; g.lineWidth = 2; rr(-w / 2, -h / 2, w, h, 14); g.stroke();
  g.restore();
}

/* ======================= SZENEN ======================= */
/* A: Cold Open — Boot, Decode, Terminal (0–4 Takte) */
function sA(t) {
  background(t, 0.15 + 0.7 * seg(t, 5, bar(4)), 'cyan');
  scanlines(0.15);
  const boot = [
    '> SYSTEM BOOT // LOONA-DESIGNS KERNEL 2026', '> LOADING MODULES ............ OK', '> MOUNT /dev/web ............. OK',
    '> CONNECT berlin.node ......... OK', '> AUTH OPERATOR ............... VERIFIED',
  ];
  boot.forEach((l, i) => {
    const a = seg(t, 0.25 + i * 0.32, 0.35 + i * 0.32);
    if (a > 0) text(l.slice(0, Math.floor(l.length * seg(t, 0.25 + i * 0.32, 0.6 + i * 0.32))), 80, 360 + i * 54, { size: 30, weight: 500, fam: JM, color: i === 4 ? C.orange : '#7DD3A8', alpha: a });
  });
  // Decode-Zeile
  const dp = seg(t, 2.2, 3.6);
  if (dp > 0) {
    const s = scramble('IDENTIFYING OPERATOR', dp, 11, Math.floor(t * 20));
    text(s, W / 2, 860, { size: 54, weight: 700, fam: JM, align: 'center', color: C.ink, ls: 4 });
    g.fillStyle = 'rgba(255,255,255,0.12)'; g.fillRect(140, 900, W - 280, 6);
    g.fillStyle = C.amber; g.fillRect(140, 900, (W - 280) * eIO(dp), 6);
  }
  // Terminal-Fenster
  const a = eOut(seg(t, 3.7, 4.2));
  if (a > 0) {
    g.save(); g.globalAlpha = a; g.translate(0, (1 - a) * 60);
    g.fillStyle = 'rgba(12,15,22,0.94)'; rr(70, 1010, W - 140, 480, 26); g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.12)'; g.lineWidth = 2; g.stroke();
    ['#ff5f57', '#febc2e', '#28c840'].forEach((c, i) => { g.fillStyle = c; g.beginPath(); g.arc(120 + i * 36, 1058, 11, 0, 7); g.fill(); });
    const typed = (s, x, y) => s.slice(0, Math.floor(s.length * seg(t, x, y)));
    const L = [
      ['❯ ', typed('ssh bjoern@loona-designs.de', 4.3, 5.2), C.ink],
      ...(t > 5.4 ? [['', 'Welcome back, Operator.', C.soft]] : []),
      ...(t > 5.7 ? [['❯ ', typed('whoami', 5.8, 6.2), C.ink]] : []),
      ...(t > 6.4 ? [['', 'bjoern-sellnau', C.amber]] : []),
    ];
    L.forEach(([p, s, col], i) => {
      const y = 1150 + i * 66;
      text(p, 110, y, { size: 38, weight: 600, fam: JM, color: C.orange });
      text(s, 110 + (p ? 50 : 0), y, { size: 38, weight: 500, fam: JM, color: col });
      if (i === L.length - 1 && Math.floor(t * 3) % 2 === 0) { const w = measure(s, 38, 500, JM); g.fillStyle = C.amber; g.fillRect(110 + (p ? 50 : 0) + w + 6, y - 32, 20, 40); }
    });
    g.restore();
  }
  brackets(40, 260, W - 80, 1300, 'rgba(94,234,212,0.5)', seg(t, 0.1, 0.5));
  kicker('REEL 02  ///  BJOERN.EXE', 80, 300, seg(t, 0.2, 0.6), C.cyan);
  speedLines(t, seg(t, bar(4) - 1.2, bar(4)) * 0.9);
  const gl = seg(t, bar(4) - 0.5, bar(4));
  if (gl > 0) { glitch(gl * 1.4, Math.floor(t * 30)); flash(eIn(gl)); }
}

/* B: Titel-Drop */
function sB(t) {
  const lt = t - bar(4);
  g.save(); shakeT(Math.max(0, 40 - lt * 90), t);
  background(t, 1.2 + pulse(t) * 0.6);
  shockwave(W / 2, 960, lt); shockwave(W / 2, 960, lt - 0.12, '255,122,47', 1600);
  burst(W / 2, 960, lt, 31, 90);
  const k = eOut5(seg(lt, 0, 0.5));
  const s1 = fit('BJÖRN', W - 120, 330, 700, SG, -12), s2 = fit('SELLNAU', W - 100, 330, 700, SG, -12);
  const rgb = Math.max(0, 22 - lt * 30) + pulse(t, 10) * 6;
  g.save(); g.translate(W / 2, 900); g.scale(lerp(2.2, 1, k), lerp(2.2, 1, k));
  rgbText('BJÖRN', 0, 0, { size: s1, align: 'center', ls: -12, alpha: k }, rgb);
  g.restore();
  g.save(); g.translate(W / 2, 1180); g.scale(lerp(2.6, 1, eOut5(seg(lt, 0.12, 0.6))), lerp(2.6, 1, eOut5(seg(lt, 0.12, 0.6))));
  rgbText('SELLNAU', 0, 0, { size: s2, align: 'center', ls: -12, color: C.amber, alpha: seg(lt, 0.12, 0.3) }, rgb);
  g.restore();
  const tg = seg(lt, 0.8, 1.6);
  text(scramble('/// THE WEB. MY PASSION', tg, 3, Math.floor(t * 24)), W / 2, 1320, { size: 40, weight: 500, fam: JM, color: C.soft, ls: 8, align: 'center', alpha: tg > 0 ? 1 : 0 });
  const lb = eBack(seg(lt, 1.6, 2.1));
  if (lb > 0) {
    const w = 520 * lb; g.fillStyle = C.amber; rr(W / 2 - w / 2, 1400, w, 90, 45); g.fill();
    text('SENIOR DEVELOPER', W / 2, 1460, { size: 40, weight: 700, fam: SG, color: '#1A1208', align: 'center', alpha: clamp(lb), ls: 2 });
  }
  ldTile(W / 2, 470, 170 * eElastic(seg(lt, 0.4, 1.4)), C.tileInk, C.deep, seg(lt, 0.4, 0.6));
  g.restore();
  const out = seg(t, bar(6) - 0.3, bar(6)); if (out > 0) glitch(out, Math.floor(t * 30) + 200);
}

/* C: Wer — Karten fliegen auf den Beats ein */
const WHO = [
  ['AKTUELL', 'Senior Developer', 'Materna SE · Public Sector · E-Gov · Zoll', C.amber],
  ['BASE', 'Berlin', 'Web Engineer seit September 2007', C.cyan],
  ['AUSBILDER', 'IHK Berlin · AEVO', 'Fachinformatiker Anwendungsentwicklung', C.violet],
  ['MISSION', 'Das Web.', 'Dinge bauen, die bleiben.', C.orange],
];
function sC(t) {
  const lt = t - bar(6);
  background(t, 0.9 + pulse(t) * 0.5);
  kicker('WHO IS', 80, 300, 1);
  text('Björn?', 80, 440, { size: 150, weight: 700, ls: -6, alpha: eOut(seg(lt, 0, 0.3)) });
  WHO.forEach(([k2, h, s, col], i) => {
    const st = 0.35 + i * B * 1.5, a = eOut5(seg(lt, st, st + 0.35));
    const y = 560 + i * 270, dir = i % 2 ? 1 : -1;
    g.save(); g.translate((1 - a) * dir * 1100, 0);
    g.fillStyle = 'rgba(255,255,255,0.05)'; rr(70, y, W - 140, 230, 30); g.fill();
    g.fillStyle = col; rr(70, y, 14, 230, 7); g.fill();
    text(k2, 120, y + 60, { size: 26, weight: 600, fam: JM, color: col, ls: 6 });
    text(h, 120, y + 140, { size: fit(h, W - 260, 76, 700), weight: 700, ls: -2 });
    text(s, 120, y + 192, { size: 32, weight: 500, fam: IS, color: C.soft });
    g.restore();
    if (lt > st && lt < st + 0.2) flash((0.2 - (lt - st)) * 0.8, '255,255,255');
  });
  const out = seg(t, bar(8) - 0.25, bar(8)); if (out > 0) glitch(out, Math.floor(t * 30) + 300);
}

/* D: Stack-Wand — diagonale Laufbänder, Fokuswort pro Beat */
const ROWS = [

/* ---------- Übergänge ---------- */
const SCENES = [[0, sA], [4, sB], [6, sC], [8, sD], [11, sE], [13, sF], [19, sG1], [20, sG2], [24, sG3], [26, sG4], [28, sH], [31, sI], [34, sJ], [36, sK]];
const sceneAt = (t) => { let fn = sA; for (const [b, f] of SCENES) if (t >= bar(b)) fn = f; return fn; };
/* Takt → Art; die übrigen Schnitte bleiben Glitch/Flash */
const TRANS = { 8: 'whip', 13: 'zoom', 26: 'whipV', 28: 'iris', 31: 'whip', 34: 'zoom' };
const TD = 0.3;
const mkLayer = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c.getContext('2d'); };
const LA = mkLayer(), LB = mkLayer();
function drawInto(ctx, fn, t) {
  const keep = g; g = ctx; g.save(); fn(t); g.restore(); g = keep;
}
/* Bewegungsunschärfe: N Kopien gemittelt (Gewicht 1/(k+1)) */
function smear(src, dx, dy, bx2, by2, n = 12) {
  for (let k = 0; k < n; k++) {
    const u = n > 1 ? k / (n - 1) - 0.5 : 0;
    g.globalAlpha = 1 / (k + 1); g.drawImage(src, dx + u * bx2, dy + u * by2);
  }
  g.globalAlpha = 1;
}
function transition(kind, p, t) {
  const A = LA.canvas, Bc = LB.canvas, e = eIO(p), sp = Math.sin(Math.PI * p);
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  if (kind === 'whip' || kind === 'whipV') {
    const hor = kind === 'whip', blur = 420 * sp, d = hor ? W : H;
    const o1 = -d * e, o2 = d * (1 - e);
    smear(A, hor ? o1 : 0, hor ? 0 : o1, hor ? blur : 0, hor ? 0 : blur);
    smear(Bc, hor ? o2 : 0, hor ? 0 : o2, hor ? blur : 0, hor ? 0 : blur);
    g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.5 * sp;
    g.drawImage(Bc, hor ? o2 + 18 : 0, hor ? 0 : o2 + 18); g.restore();
  } else if (kind === 'zoom') {
    const zin = lerp(0.55, 1, eOut5(seg(p, 0.25, 1))), zout = 1 + 2.4 * eIn(p);
    g.save(); g.filter = `blur(${Math.round(16 * (1 - seg(p, 0.3, 1)))}px)`; g.globalAlpha = seg(p, 0.25, 0.65);
    g.translate(W / 2, H / 2); g.scale(zin, zin); g.drawImage(Bc, -W / 2, -H / 2); g.restore();
    g.save(); g.filter = `blur(${Math.round(22 * seg(p, 0, 0.6))}px)`; g.globalAlpha = 1 - seg(p, 0.35, 0.7);
    g.translate(W / 2, H / 2); g.scale(zout, zout); g.drawImage(A, -W / 2, -H / 2); g.restore();
    speedLines(t, sp * 0.8);
  } else if (kind === 'iris') {
    g.drawImage(A, 0, 0);
    const r = eIO(p) * Math.hypot(W, H) * 0.56;
    g.save(); g.beginPath(); g.arc(W / 2, H / 2, r, 0, 7); g.clip(); g.drawImage(Bc, 0, 0); g.restore();
    g.save(); g.strokeStyle = C.cyan; g.lineWidth = 10 * sp + 2; g.shadowColor = C.cyan; g.shadowBlur = 40; g.globalAlpha = sp;
    g.beginPath(); g.arc(W / 2, H / 2, r, 0, 7); g.stroke(); g.restore();
  }
  flash(Math.max(0, 0.22 - Math.abs(p - 0.5) * 0.8), '255,236,210');
}
function render(t) {
  let tr = null;
  for (const [b, kind] of Object.entries(TRANS)) { const at = bar(+b); if (t >= at - TD && t < at + TD) tr = [at, kind]; }
  g.save();
  // Beat-Zoom: kleiner Kamerastoß auf jedem Schlag (nicht im Intro und am Schluss)
  if (t > bar(4) && t < bar(38)) { const z = 1 + 0.014 * pulse(t, 9); g.translate(W / 2, H / 2); g.scale(z, z); g.translate(-W / 2, -H / 2); }
  if (tr) {
    const [at, kind] = tr;
    inTrans = true;
    drawInto(LA, sceneAt(at - 0.001), t);
    drawInto(LB, sceneAt(at), Math.max(t, at));
    inTrans = false;
    transition(kind, (t - (at - TD)) / (2 * TD), t);
  } else sceneAt(t)(t);
  g.restore();
  finish(t);
}

/* ---------- Musik ---------- */
async function music() {
  const SR = 48000, len = Math.ceil(DUR * SR);
  const ac = new OfflineAudioContext(2, len, SR);
  const master = ac.createGain(); master.gain.value = 0.45;
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 8; comp.attack.value = 0.003; comp.release.value = 0.15;
  const outG = ac.createGain(); outG.gain.value = 0.85;
  master.connect(comp); comp.connect(outG); outG.connect(ac.destination);
  // Hall (kurzer Faltungs-Hall aus Rauschen)
  const ir = ac.createBuffer(2, SR * 1.8, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (hash(i * 1.3 + c * 7) * 2 - 1) * Math.pow(1 - i / d.length, 3); }
  const verb = ac.createConvolver(); verb.buffer = ir; const verbG = ac.createGain(); verbG.gain.value = 0.25; verb.connect(verbG); verbG.connect(master);
  const nb = ac.createBuffer(1, SR * 2, SR); { const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = hash(i * 0.731) * 2 - 1; }
  const noise = (t, dur, f0, f1, gain, type = 'highpass', q = 0.7, wet = false) => {
    const s = ac.createBufferSource(); s.buffer = nb; const f = ac.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const gg = ac.createGain(); gg.gain.setValueAtTime(gain, t); gg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(gg); gg.connect(master); if (wet) gg.connect(verb); s.start(t); s.stop(t + dur + 0.05);
  };
  const riser = (t, dur, gain) => {
    const s = ac.createBufferSource(); s.buffer = nb; s.loop = true; const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 2.5;
    f.frequency.setValueAtTime(250, t); f.frequency.exponentialRampToValueAtTime(7000, t + dur);
    const gg = ac.createGain(); gg.gain.setValueAtTime(0.0001, t); gg.gain.exponentialRampToValueAtTime(gain, t + dur);
    s.connect(f); f.connect(gg); gg.connect(master); gg.connect(verb); s.start(t); s.stop(t + dur);
  };
  const kick = (t, g0 = 1) => {
    const o = ac.createOscillator(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.16);
    const gg = ac.createGain(); gg.gain.setValueAtTime(g0, t); gg.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
    o.connect(gg); gg.connect(master); o.start(t); o.stop(t + 0.4);
    noise(t, 0.02, 4000, 3000, 0.25 * g0, 'highpass');
  };
  const boom = (t) => { kick(t, 1.4); noise(t, 2.2, 1200, 60, 0.55, 'lowpass', 0.7, true); };
  const tone = (t, dur, freq, type, gain, cutoff, wet = false, detune = 0, att = 0.01) => {
    const o = ac.createOscillator(); o.type = type; o.frequency.value = freq; o.detune.value = detune;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
    const gg = ac.createGain(); gg.gain.setValueAtTime(0.0001, t); gg.gain.exponentialRampToValueAtTime(gain, t + att); gg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(gg); gg.connect(master); if (wet) gg.connect(verb); o.start(t); o.stop(t + dur + 0.05);
  };
  const midi = (n) => 440 * Math.pow(2, (n - 69) / 12);
  // f-Moll-Gefühl: Fm – Db – Ab – Eb
  const CH = [[53, 56, 60], [49, 53, 56], [56, 60, 63], [51, 55, 58]];
  const ROOT = [41, 37, 44, 39];
  const section = (b) => (b < 4 ? 'intro' : b < 19 ? 'main' : b < 20 ? 'break' : b < 28 ? 'drop' : b < 36 ? 'main' : b < 38 ? 'outro' : 'end');
  for (let b = 0; b < 40; b++) {
    const t0 = bar(b), ch = CH[b % 4], sec = section(b);
    // Fläche (Supersaw)
    if (sec !== 'end') ch.forEach((n) => [-12, 0, 12].forEach((d) => tone(t0, BAR + 0.5, midi(n), 'sawtooth', sec === 'break' ? 0.05 : 0.022, sec === 'drop' ? 2600 : 1500, true, d, 0.08)));
    if (sec === 'main' || sec === 'drop') {
      for (let k = 0; k < 4; k++) {
        const tb = t0 + k * B;
        kick(tb);
        noise(tb + B / 2, 0.08, 6500, 9000, 0.2);
        noise(tb + B / 4, 0.025, 9000, 10000, 0.06); noise(tb + B * 3 / 4, 0.025, 9000, 10000, 0.06);
        if (k % 2 === 1) noise(tb, 0.2, 1700, 500, 0.3, 'bandpass', 0.9, true);
        // Bass (Achtel, Offbeat betont)
        for (let e = 0; e < 2; e++) tone(tb + e * B / 2 + 0.02, B / 2 - 0.03, midi(ROOT[b % 4] - 12 + (e ? 12 : 0)), 'sawtooth', e ? 0.2 : 0.14, sec === 'drop' ? 900 : 450);
      }
      // Arpeggio
      const steps = sec === 'drop' ? 16 : 8;
      for (let s = 0; s < steps; s++) tone(t0 + s * BAR / steps, BAR / steps, midi(ch[s % 3] + 12 + (Math.floor(s / 3) % 2) * 12), 'square', sec === 'drop' ? 0.035 : 0.028, 3200, true);
    }
    if (sec === 'intro') { // Puls im Intro
      for (let k = 0; k < 4; k++) tone(t0 + k * B, 0.1, midi(ROOT[b % 4] + 12), 'triangle', 0.06, 1200, true);
      if (b >= 2) for (let k = 0; k < 4; k++) noise(t0 + k * B + B / 2, 0.05, 7000, 9000, 0.07);
    }
  }
  // Tippen / Boot
  for (let i = 0; i < 24; i++) noise(0.25 + i * 0.07, 0.02, 3000, 5000, 0.08, 'bandpass', 3);
  for (let i = 0; i < 26; i++) noise(4.3 + i * 0.034, 0.02, 3000, 5000, 0.1, 'bandpass', 3);
  for (let i = 0; i < 6; i++) noise(5.8 + i * 0.066, 0.02, 3000, 5000, 0.1, 'bandpass', 3);
  // Countdown-Beeps im Breakdown
  for (let i = 0; i < 3; i++) tone(bar(19) + i * BAR / 4, 0.18, midi(84), 'square', 0.08, 5000, true);
  tone(bar(19) + 3 * BAR / 4, 0.4, midi(96), 'square', 0.09, 6000, true);
  [8, 13, 26, 28, 31, 34].forEach((b) => noise(bar(b) - 0.34, 0.5, 300, 6000, 0.32, 'bandpass', 1.4, true));
  riser(bar(2), bar(4) - bar(2), 0.35);
  riser(bar(19), BAR, 0.45);
  riser(bar(36) - BAR, BAR, 0.3);
  [bar(4), bar(6), bar(8), bar(11), bar(13), bar(20), bar(24), bar(26), bar(28), bar(31), bar(34), bar(36)].forEach((t) => boom(t));
  // Schluss-Akkord
  CH[0].forEach((n) => tone(bar(38), 2.6, midi(n), 'triangle', 0.06, 2000, true));
  const bufA = await ac.startRendering();
  const L = bufA.getChannelData(0), Rr = bufA.getChannelData(1), n = L.length;
  const wv = new DataView(new ArrayBuffer(44 + n * 4));
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) wv.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); wv.setUint32(4, 36 + n * 4, true); ws(8, 'WAVE'); ws(12, 'fmt '); wv.setUint32(16, 16, true);
  wv.setUint16(20, 1, true); wv.setUint16(22, 2, true); wv.setUint32(24, SR, true); wv.setUint32(28, SR * 4, true);
  wv.setUint16(32, 4, true); wv.setUint16(34, 16, true); ws(36, 'data'); wv.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) { wv.setInt16(44 + i * 4, clamp(L[i], -1, 1) * 32767, true); wv.setInt16(46 + i * 4, clamp(Rr[i], -1, 1) * 32767, true); }
  const bytes = new Uint8Array(wv.buffer); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
