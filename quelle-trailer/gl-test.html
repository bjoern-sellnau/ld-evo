<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>GLX — Testseite (Echtzeit)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #F6F1E8; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  canvas { display: block; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; margin: 0 auto; image-rendering: pixelated; }
  #hud { position: fixed; left: 12px; top: 10px; background: rgba(11, 16, 38, 0.72); padding: 6px 10px; white-space: pre; }
  #hud b { color: #FF7816; }
</style>
</head>
<body>
<!-- Zeigt einen Test des GLX-Engines in Echtzeit (requestAnimationFrame) und misst die Bildrate.
     Aufruf: gl-test.html?test=orbit|tunnel|moon|hall|galaxy|screens|gold|blit&look=97|2k — Tasten 1 … 8 wechseln den Test, L den Look. -->
<canvas id="v"></canvas>
<div id="hud"></div>
<script src="gl/glx.js"></script>
<script src="gl/glx-tests.js"></script>
<script>
'use strict';
(async () => {
  const Q = new URLSearchParams(location.search), look = Q.get('look') === '97' ? '97' : '2k', hud = document.getElementById('hud');
  /* ein paar Bilder für die Tests „screens“ und „blit“ (eigene Screenshots aus assets/) */
  const SRC = { a: 'assets/g_core-fall-menu.jpg', b: 'assets/g_co-play3.jpg', c: 'assets/sf_01-pariser-platz.jpg', d: 'assets/site_home.jpg', e: 'assets/g_cf-play13.jpg', f: 'assets/sf_07-tv-tower.jpg', g: 'assets/site_labs.jpg', h: 'assets/g_co-play6.jpg' };
  const images = {};
  await Promise.all(Object.entries(SRC).map(([k, s]) => new Promise((ok) => { const i = new Image(); i.onload = () => { images[k] = i; ok(); }; i.onerror = () => ok(); i.src = s; })));
  const w = look === '97' ? 640 : 960;
  GLX.init({ canvas: document.getElementById('v'), width: w, height: (w * 9) / 16, look, images });
  const OPT = { screens: { images: Object.keys(images) }, blit: { images: ['d', 'a', 'b', 'c', 'e'] } };
  let test = GLX.test[Q.get('test')] ?? GLX.test.tunnel, t0 = performance.now(), n = 0, tf = t0, fps = 0;
  addEventListener('keydown', (e) => {
    const k = +e.key; if (k >= 1 && k <= GLX.tests.length) { test = GLX.tests[k - 1]; t0 = performance.now(); }
    if (e.key === 'l' || e.key === 'L') { Q.set('look', look === '97' ? '2k' : '97'); Q.set('test', test.id); location.search = Q.toString(); }
  });
  /* zum Prüfen von außen: ein bestimmtes Bild eines Tests zeichnen */
  window.GLTEST = { draw: (id, lt, D = GLX.test[id].dur) => { GLX.begin(); GLX.test[id].draw(lt, D, OPT[id] ?? {}); GLX.end(); return GLX.stats.tris; }, images };
  if (Q.get('still')) return;
  const loop = (now) => {
    const lt = ((now - t0) / 1000) % test.dur;
    GLX.begin(); test.draw(lt, test.dur, OPT[test.id] ?? {}); GLX.end();
    n++; if (now - tf >= 1000) { fps = (n * 1000) / (now - tf); n = 0; tf = now; }
    hud.innerHTML = `<b>${test.name.de}</b> (${test.id}) · Look ${look} · ${GLX.W}×${GLX.H}\n${fps.toFixed(1)} Bilder/s · ${GLX.stats.tris} Dreiecke · ${lt.toFixed(1)} / ${test.dur} s\nTasten 1–${GLX.tests.length}: Test · L: Look`;
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
