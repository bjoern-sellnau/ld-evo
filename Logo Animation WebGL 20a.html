<canvas id="c"></canvas>

 <h4>Einstellungen</h4>
 <div class="row"><span>Glow-Farbe (Ende)</span><div class="sw" id="sw"><input id="cc" type="color" title="Eigene Farbe"></div></div>

<script>
(function(){
'use strict';
var W=1280,H=720;
/* cues */
var K=3.9,LS=K+2.4,DS=LS+2.3,AR=DS+2.0,R=AR+2.6,SQ=R+2.6,LI=SQ+2.8,GS=LI+1.3,TOTAL=LI+5.0;
var tCF=K+1.75,tLF=LS+1.65,tDF=DS+1.45;
var SCENES=[[0,'Plattform'],[K,'Laser · D-Kurve'],[LS,'Laser · L'],[DS,'Laser · D'],[AR,'Roboterarme'],[R,'Riss'],[SQ,'Squircle'],[LI,'Blackout'],[GS,'Glow']];
var AM=[1,0.471,0.086],CREAM=[0.969,0.949,0.918],INK=[0.090,0.075,0.063],BG=[0.090,0.075,0.063];
var canvas=document.getElementById('c');
var gl=canvas.getContext('webgl2',{stencil:true,antialias:true,alpha:false,premultipliedAlpha:true});
if(!gl){document.getElementById('nogl').style.display='flex';return;}

/* ---------- settings ---------- */
var SET={glow:'#FFFFFF',margin:20};
try{var ss=JSON.parse(localStorage.getItem('loona-webgl:settings')||'{}');if(/^#[0-9a-f]{6}$/i.test(ss.glow||''))SET.glow=ss.glow;if(isFinite(+ss.margin))SET.margin=+ss.margin;}catch(e){}
function saveSet(){try{localStorage.setItem('loona-webgl:settings',JSON.stringify(SET));}catch(e){}}
function hexc(c){return [parseInt(c.slice(1,3),16)/255,parseInt(c.slice(3,5),16)/255,parseInt(c.slice(5,7),16)/255];}

/* ---------- math ---------- */
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,u){return a+(b-a)*u;}
function prog(t,s,e,ease){var u=clamp((t-s)/Math.max(e-s,1e-6),0,1);return ease?ease(u):u;}
var E={out:function(u){return 1-Math.pow(1-u,3);},inout:function(u){return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;},acc:function(u){return u*u;}};
function rnd(i){var x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function mixc(a,b,u){return [lerp(a[0],b[0],u),lerp(a[1],b[1],u),lerp(a[2],b[2],u)];}
function arc(cx,cy,r,a0,a1,n){var o=[];for(var i=0;i<=n;i++){var a=a0+(a1-a0)*i/n;o.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}return o;}
function cubic(p0,p1,p2,p3,n){var o=[];for(var i=1;i<=n;i++){var t=i/n,m=1-t;o.push([m*m*m*p0[0]+3*m*m*t*p1[0]+3*m*t*t*p2[0]+t*t*t*p3[0],m*m*m*p0[1]+3*m*m*t*p1[1]+3*m*t*t*p2[1]+t*t*t*p3[1]]);}return o;}
function lens(p){var L=[0];for(var i=1;i<p.length;i++){var dx=p[i][0]-p[i-1][0],dy=p[i][1]-p[i-1][1];L.push(L[i-1]+Math.sqrt(dx*dx+dy*dy));}return L;}
function interp(p,L,d){for(var i=1;i<p.length;i++){if(L[i]>=d){var s=L[i]-L[i-1],f=s>0?(d-L[i-1])/s:0;return [lerp(p[i-1][0],p[i][0],f),lerp(p[i-1][1],p[i][1],f)];}}return p[p.length-1];}
function partial(p,L,u){var tg=u*L[L.length-1],o=[p[0]];for(var i=1;i<p.length;i++){if(L[i]<=tg)o.push(p[i]);else{o.push(interp(p,L,tg));break;}}return o;}
function segment(p,L,u0,u1){var tot=L[L.length-1],a=u0*tot,b=u1*tot,o=[interp(p,L,a)];for(var i=1;i<p.length;i++){if(L[i]>a&&L[i]<b)o.push(p[i]);}o.push(interp(p,L,b));return o;}
function closed(c){return c.concat([c[0]]);}
function rect(x,y,w,h){return [[x,y],[x+w,y],[x+w,y+h],[x,y+h]];}
function mirror(c){return c.map(function(p){return [1280-p[0],p[1]];});}
function shiftX(c,dx){return c.map(function(p){return [p[0]+dx,p[1]];});}
function fan(c){var a=[];for(var i=1;i<c.length-1;i++)a.push(c[0][0],c[0][1],c[i][0],c[i][1],c[i+1][0],c[i+1][1]);return a;}

/* ---------- geometry (mark units, 46-box; mark centred on the wall) ---------- */
var S=7,OX=486,OY=101,PLATE=OY+301,ARM_Y=OY+170,WALL_H=524,HCY=WALL_H/2;
function M(p){return [OX+S*p[0],OY+S*p[1]];}
function MC(c){return c.map(M);}
var A20=arc(24,23,20,-Math.PI/2,Math.PI/2,48),A12=arc(24,23,12,-Math.PI/2,Math.PI/2,36);
var RECT=[[0,3],[44,3],[44,43],[0,43]];
var SIL=[[0,3]].concat(A20,[[0,43]]);
var NEGL=[[8,11],[16,11],[16,27],[19,27],[22,35],[8,35]];
var CTR=[[21,11]].concat(A12,[[21,27]]);
var LP=[[0,3],[8,3],[8,35],[19,35],[22,43],[0,43]];
var DP=[[11,3]].concat(A20,[[25,43],[19,27],[16,27],[16,11],[11,11]]);
var TR=[[24,3],[44,3],[44,23]].concat(arc(24,23,20,0,-Math.PI/2,24).slice(1,-1));
var BR=[[44,23],[44,43],[24,43]].concat(arc(24,23,20,Math.PI/2,0,24).slice(1,-1));
var ARC_PX=MC(A20),ARC_L=lens(ARC_PX);
var NEGL_PX=MC(closed(NEGL)),NEGL_L=lens(NEGL_PX);
var CTR_PX=MC(closed(CTR)),CTR_L=lens(CTR_PX);
var TOPCR=MC([[9.6,3],[10.3,4.6],[9.2,6.1],[10.1,7.8],[9.4,9.4],[10,11]]),TOPCR_L=lens(TOPCR);
var BOTCR=MC([[23,43],[21.9,41.4],[22.3,39.8],[20.9,38.2],[21.4,36.6],[20.4,35]]),BOTCR_L=lens(BOTCR);
/* squircle hole: centred on wall + mark, margin to top edge and floor line from settings */
var HM,HB,SQP,SQ_L;
function buildHole(){HM=clamp(SET.margin,10,200);var size=WALL_H-2*HM;HB=size/2;var k=size/46,x0=640-HB,y0=HM;function sq(p){return [x0+k*p[0],y0+k*p[1]];}
 SQP=[sq([23,0])].concat(cubic(sq([23,0]),sq([40,0]),sq([46,6]),sq([46,23]),28),cubic(sq([46,23]),sq([46,40]),sq([40,46]),sq([23,46]),28),cubic(sq([23,46]),sq([6,46]),sq([0,40]),sq([0,23]),28),cubic(sq([0,23]),sq([0,6]),sq([6,0]),sq([23,0]),28));SQ_L=lens(SQP);}
buildHole();
/* floor hatch (perspective trapezoid) — stays open */
var HATCH=[[480,548],[800,548],[830,612],[450,612]];
var LDOOR=[[480,548],[640,548],[640,612],[450,612]],RDOOR=[[640,548],[800,548],[830,612],[640,612]];
var E1=[980,-60],E2=[-80,-60];

/* ---------- GL ---------- */
function shader(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
function program(vs,fs,attrs,unis){var p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,vs));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));var o={p:p,a:{},u:{}};attrs.forEach(function(n){o.a[n]=gl.getAttribLocation(p,n);});unis.forEach(function(n){o.u[n]=gl.getUniformLocation(p,n);});return o;}
var VS='#version 300 es\nin vec2 aPos;uniform vec2 uRes;out vec2 vP;void main(){vP=aPos;vec2 c=aPos/uRes*2.0-1.0;gl_Position=vec4(c.x,-c.y,0.0,1.0);}';
var NOISE='float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}';
var FLAT=program(VS,'#version 300 es\nprecision highp float;uniform vec4 uColor;uniform float uAdd;out vec4 o;void main(){o=vec4(uColor.rgb*uColor.a,uColor.a*(1.0-uAdd));}',['aPos'],['uRes','uColor','uAdd']);
var PT=program('#version 300 es\nin vec2 aPos;in float aSize;in vec4 aCol;uniform vec2 uRes;uniform float uScale;out vec4 vCol;void main(){vec2 c=aPos/uRes*2.0-1.0;gl_Position=vec4(c.x,-c.y,0.0,1.0);gl_PointSize=aSize*uScale;vCol=aCol;}',
 '#version 300 es\nprecision highp float;in vec4 vCol;uniform float uAdd;out vec4 o;void main(){float d=length(gl_PointCoord-0.5);float a=smoothstep(0.5,0.12,d)*vCol.a;o=vec4(vCol.rgb*a,a*(1.0-uAdd));}',['aPos','aSize','aCol'],['uRes','uScale','uAdd']);
var WALL=program(VS,'#version 300 es\nprecision highp float;in vec2 vP;uniform float uBright;uniform float uWarm;uniform float uT;out vec4 o;'+NOISE+
 'void main(){vec2 p=vP;vec2 q=p+vec2(160.0,40.0);vec2 g=mod(q,vec2(320.0));vec2 id=floor(q/320.0);float pv=0.9+0.2*hash(id);'+
 'float streak=noise(vec2(p.x*0.012,p.y*1.15))*0.55+noise(vec2(p.x*0.0035,p.y*3.3))*0.45;float grain=(hash(p)-0.5)*0.06;'+
 'vec3 base=vec3(0.135,0.124,0.112)*pv;float v=0.78+0.5*streak+grain;float sheen=0.10*smoothstep(1.0,0.0,length((p-vec2(320.0,110.0))/vec2(1150.0,760.0)));vec3 col=base*v+sheen;'+
 'float m=min(min(g.x,320.0-g.x),min(g.y,320.0-g.y));float seam=smoothstep(2.6,0.0,m)*0.6;float bevel=smoothstep(8.0,2.6,m)*0.06;col=col*(1.0-seam)+bevel;'+
 'vec2 rv=min(g,320.0-g)-vec2(22.0);float rd=length(rv);col+=smoothstep(4.5,3.0,rd)*0.07-smoothstep(6.0,4.5,rd)*0.03;'+
 'col*=1.0-0.42*smoothstep(0.5,1.25,length((p-vec2(640.0,360.0))/vec2(640.0,360.0)));col*=uBright;'+
 'vec2 e=(p-vec2(640.0,560.0))/vec2(560.0,330.0);col+=vec3(1.0,0.82,0.58)*exp(-dot(e,e)*1.8)*uWarm*0.32*(0.9+0.1*streak);o=vec4(col,1.0);}',['aPos'],['uRes','uBright','uWarm','uT']);
var FLOOR=program(VS,'#version 300 es\nprecision highp float;in vec2 vP;uniform float uBright;uniform float uHatch;uniform float uHole;uniform float uT;out vec4 o;'+NOISE+
 'void main(){vec2 p=vP;float yy=max(p.y-300.0,30.0);float depth=1200.0/yy;float wx=(p.x-640.0)*depth/800.0;'+
 'vec2 g=vec2(fract(wx*0.8+0.5),fract(depth*0.8));float m=min(min(g.x,1.0-g.x),min(g.y,1.0-g.y));float sw=0.012*depth;float seam=smoothstep(sw,0.0,m)*0.55;'+
 'float streak=noise(vec2(wx*2.5,depth*30.0))*0.45+noise(vec2(wx*0.6,depth*9.0))*0.55;float grain=(hash(p)-0.5)*0.05;'+
 'vec3 base=vec3(0.105,0.097,0.088)*(0.72+0.5*streak)+grain;base*=(1.0-seam);float ao=0.55+0.45*smoothstep(524.0,600.0,p.y);vec3 col=base*ao*uBright;'+
 'vec2 e=(p-vec2(640.0,585.0))/vec2(300.0,70.0);col+=vec3(1.0,0.86,0.62)*exp(-dot(e,e)*1.5)*uHatch*0.5;'+
 'float wash=smoothstep(720.0,524.0,p.y)*0.16;vec2 r=(p-vec2(640.0,650.0))/vec2(260.0,90.0);float refl=exp(-dot(r,r)*1.3)*(0.55+0.45*noise(vec2(p.x*0.06,p.y*0.5)));col+=vec3(0.97,0.64,0.10)*(refl*0.85+wash)*uHole;'+
 'col*=1.0-0.35*smoothstep(0.6,1.3,length((p-vec2(640.0,520.0))/vec2(640.0,420.0)));o=vec4(col,1.0);}',['aPos'],['uRes','uBright','uHatch','uHole','uT']);
var LIGHT=program(VS,'#version 300 es\nprecision highp float;in vec2 vP;uniform float uOpen;uniform float uT;uniform float uHalo;uniform float uLevel;uniform float uCY;uniform float uHB;out vec4 o;'+NOISE+
 'float sd(vec2 p,float b){vec2 q=abs(p)/b;float n=4.0;return pow(pow(q.x,n)+pow(q.y,n),1.0/n)-1.0;}'+
 'void main(){vec2 p=vP-vec2(640.0,uCY);float r=length(p)/uHB;'+
 'if(uHalo>0.5){float d=max(sd(p,uHB),0.0)*uHB;float halo=exp(-d/26.0)*0.30+exp(-d/110.0)*0.09;o=vec4(vec3(0.98,0.68,0.18)*halo*uOpen,0.0);return;}'+
 'vec3 warm=vec3(1.0,0.96,0.85),amber=vec3(0.98,0.70,0.20),deep=vec3(0.86,0.50,0.06);vec3 lit=mix(warm,amber,smoothstep(0.1,0.7,r));lit=mix(lit,deep,smoothstep(0.7,1.05,r));'+
 'lit+=vec3(1.0,0.92,0.75)*exp(-r*r*2.2)*0.5;lit*=0.93+0.07*noise(vec2(p.x*0.012,p.y*0.03+uT*0.25));o=vec4(lit*uLevel,1.0);}',['aPos'],['uRes','uOpen','uT','uHalo','uLevel','uCY','uHB']);
var ATMO=program(VS,'#version 300 es\nprecision highp float;in vec2 vP;uniform float uHatch;uniform float uHW;uniform float uHole;uniform float uCY;uniform float uHB;uniform float uT;out vec4 o;'+NOISE+
 'void main(){vec2 p=vP;vec3 c=vec3(0.0);'+
 'float hy=585.0-p.y;if(hy>0.0){float hw=uHW*(1.0+hy/700.0*0.6);float u=abs(p.x-640.0)/hw;float sh=smoothstep(1.0,0.3,u)*exp(-hy/360.0);sh*=0.7+0.3*noise(vec2(p.x*0.012,p.y*0.012-uT*0.18));c+=vec3(1.0,0.88,0.66)*sh*uHatch*0.42;}'+
 'vec2 e=(p-vec2(640.0,585.0))/vec2(230.0,42.0);c+=vec3(1.0,0.9,0.72)*exp(-dot(e,e))*uHatch*0.5;'+
 'float by=p.y-uCY;if(by>0.0){float hw=uHB+by*1.05;float u=abs(p.x-640.0)/hw;float b=smoothstep(1.0,0.25,u)*exp(-by/460.0)*smoothstep(uCY-50.0,uCY+240.0,p.y);b*=0.65+0.35*noise(vec2(p.x*0.007+uT*0.04,p.y*0.011-uT*0.02));c+=vec3(0.98,0.66,0.22)*b*uHole*0.38;}'+
 'o=vec4(c,0.0);}',['aPos'],['uRes','uHatch','uHW','uHole','uCY','uHB','uT']);
var TEX=program('#version 300 es\nin vec2 aPos;in vec2 aUV;uniform vec2 uRes;out vec2 vUV;void main(){vUV=aUV;vec2 c=aPos/uRes*2.0-1.0;gl_Position=vec4(c.x,-c.y,0.0,1.0);}',
 '#version 300 es\nprecision highp float;in vec2 vUV;uniform sampler2D uTex;uniform float uAlpha;uniform float uAdd;out vec4 o;void main(){vec4 c=texture(uTex,vUV)*uAlpha;o=vec4(c.rgb,c.a*(1.0-uAdd));}',['aPos','aUV'],['uRes','uTex','uAlpha','uAdd']);
var vbo=gl.createBuffer(),uvbo=gl.createBuffer();
gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
var scale=1;
function use(P){gl.useProgram(P.p);gl.uniform2f(P.u.uRes,W,H);}
function upload(arr){gl.bindBuffer(gl.ARRAY_BUFFER,vbo);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(arr),gl.DYNAMIC_DRAW);}
function drawArr(P,arr){upload(arr);gl.enableVertexAttribArray(P.a.aPos);gl.vertexAttribPointer(P.a.aPos,2,gl.FLOAT,false,0,0);gl.drawArrays(gl.TRIANGLES,0,arr.length/2);}
function tris(arr,color,add){if(!arr.length)return;use(FLAT);gl.uniform4f(FLAT.u.uColor,color[0],color[1],color[2],color.length>3?color[3]:1);gl.uniform1f(FLAT.u.uAdd,add?1:0);drawArr(FLAT,arr);}
function quad(x,y,w,h){return [x,y,x+w,y,x,y+h,x+w,y,x+w,y+h,x,y+h];}
function drawQuad(P,x,y,w,h,set){use(P);set&&set();drawArr(P,quad(x,y,w,h));}
function fullscreen(P,set){drawQuad(P,0,0,W,H,set);}
function drawFan(P,pts,set){use(P);set&&set();drawArr(P,fan(pts));}
function fillShape(contours,color){var f=[],minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
 contours.forEach(function(c){for(var i=1;i<c.length-1;i++)f.push(c[0][0],c[0][1],c[i][0],c[i][1],c[i+1][0],c[i+1][1]);c.forEach(function(p){if(p[0]<minx)minx=p[0];if(p[0]>maxx)maxx=p[0];if(p[1]<miny)miny=p[1];if(p[1]>maxy)maxy=p[1];});});
 if(!f.length)return;
 gl.enable(gl.STENCIL_TEST);gl.stencilMask(0xff);gl.colorMask(false,false,false,false);gl.stencilFunc(gl.ALWAYS,0,0xff);gl.stencilOp(gl.KEEP,gl.KEEP,gl.INVERT);
 use(FLAT);gl.uniform1f(FLAT.u.uAdd,0);drawArr(FLAT,f);
 gl.colorMask(true,true,true,true);gl.stencilFunc(gl.EQUAL,1,1);gl.stencilOp(gl.KEEP,gl.KEEP,gl.ZERO);
 tris([minx,miny,maxx,miny,minx,maxy,maxx,miny,maxx,maxy,minx,maxy],color,false);
 gl.disable(gl.STENCIL_TEST);}
function withClip(contour,fn){gl.enable(gl.STENCIL_TEST);gl.stencilMask(0xff);gl.colorMask(false,false,false,false);gl.stencilFunc(gl.ALWAYS,0,0xff);gl.stencilOp(gl.KEEP,gl.KEEP,gl.INVERT);
 use(FLAT);gl.uniform1f(FLAT.u.uAdd,0);drawArr(FLAT,fan(contour));
 gl.colorMask(true,true,true,true);gl.stencilFunc(gl.NOTEQUAL,0,0xff);gl.stencilOp(gl.KEEP,gl.KEEP,gl.KEEP);gl.stencilMask(0);

   if(t<SQ+3.0){var sp=slabPts(tip,drop),g=Math.exp(-(t-(SQ+1.4))*0.8);withClip(SQP,function(){drawFan(WALL,sp,function(){gl.uniform1f(WALL.u.uBright,wallB*(1-tip)*(1-tip));gl.uniform1f(WALL.u.uWarm,hatch*(1-tip));gl.uniform1f(WALL.u.uT,t);});stroke(closed(sp),2.4,[1,0.6,0.12,0.85*g],true);});}
   if(lit>0)fullscreen(LIGHT,function(){gl.uniform1f(LIGHT.u.uHalo,1);gl.uniform1f(LIGHT.u.uOpen,lit);gl.uniform1f(LIGHT.u.uT,t);gl.uniform1f(LIGHT.u.uLevel,pw);gl.uniform1f(LIGHT.u.uCY,HCY);gl.uniform1f(LIGHT.u.uHB,HB);});
  }
 }
 var sqLaser=t>=SQ+0.1&&t<SQ+1.4?mkLaser(E2,SQP,SQ_L,SQ+0.1,SQ+1.4,t):null;
 cutGlow(SQP,SQ_L,SQ+0.1,SQ+1.4,t,0.7);
 if(!dark){
  drawQuad(FLOOR,0,524,W,196,floorSet);
  drawHatch(hd,pw);
  drawPlatform(plateTop,pw);
 }
 var laser=drawMark(t,rise,lit,pw,I,GC)||sqLaser;
 if(!dark){drawQuad(FLOOR,0,612,W,108,floorSet);if(lit>0)shadows(lit);}
 fallingPieces(t);
 tearParticles(t);
 arms(t);
 if(laser)drawLaser(t,laser);
 if(!dark)fullscreen(ATMO,function(){gl.uniform1f(ATMO.u.uHatch,hatch*(1-0.35*prog(t,3.0,3.6)));gl.uniform1f(ATMO.u.uHW,190*hd);gl.uniform1f(ATMO.u.uHole,lit);gl.uniform1f(ATMO.u.uCY,HCY);gl.uniform1f(ATMO.u.uHB,HB);gl.uniform1f(ATMO.u.uT,t);});
 var du=Math.min(1,lit+Math.min(1,I)*0.25);if(du>0)points(dust(t,du,lit>0?[1,0.85,0.55]:GC),true);
 /* THX-style self-lit logo + glowing lines on black */
 var t1=prog(t,GS+1.3,GS+2.0,E.out),t2=prog(t,GS+1.7,GS+2.4,E.out),y1=566+10*(1-t1),y2=608+10*(1-t2);
 blit(tex1,0,y1,W,110,t1,false,false);blit(tex2,0,y2,W,110,t2,false,false);
 if(I>0)glowPass(t,I,GC,t1,y1,t2,y2);
}

/* ---------- playback ---------- */
var KEY='loona-webgl-20a:t',time=parseFloat(localStorage.getItem(KEY)||'0');if(!isFinite(time)||time>=TOTAL-0.05)time=0;
var playing=true,last=null,saveAt=0;
var pp=document.getElementById('pp'),sk=document.getElementById('sk'),tm=document.getElementById('tm'),sc=document.getElementById('sc');
sk.max=TOTAL;
var lastVW=-1,lastVH=-1;
function resize(){var vw=innerWidth,vh=innerHeight-44;if(vw<=0||vh<=0)return;if(vw===lastVW&&vh===lastVH)return;lastVW=vw;lastVH=vh;var s=Math.max(0.01,Math.min(vw/W,vh/H)),dpr=Math.min(devicePixelRatio||1,2);canvas.style.width=(W*s)+'px';canvas.style.height=(H*s)+'px';canvas.style.top=(vh/2)+'px';canvas.width=Math.max(1,Math.round(W*s*dpr));canvas.height=Math.max(1,Math.round(H*s*dpr));scale=canvas.width/W;}
addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe(document.body);resize();
function ui(){pp.textContent=playing?'❙❙':(time>=TOTAL-0.001?'↻':'▶');if(document.activeElement!==sk)sk.value=time.toFixed(2);tm.textContent=time.toFixed(1)+' / '+TOTAL.toFixed(1)+' s';var name='';for(var i=0;i<SCENES.length;i++)if(time>=SCENES[i][0])name=SCENES[i][1];sc.textContent=name;}
function toggle(){if(playing){playing=false;}else{if(time>=TOTAL-0.001)time=0;playing=true;}ui();}
pp.addEventListener('click',toggle);
addEventListener('keydown',function(e){if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();toggle();}});
sk.addEventListener('input',function(){time=parseFloat(sk.value)||0;playing=false;render(time);ui();});
function frame(ts){resize();if(playing){if(last!=null)time=Math.min(TOTAL,time+(ts-last)/1000);last=ts;if(time>=TOTAL)playing=false;}else last=ts;render(time);ui();if(ts-saveAt>250){saveAt=ts;try{localStorage.setItem(KEY,String(time));}catch(e){}}requestAnimationFrame(frame);}
requestAnimationFrame(frame);

/* ---------- settings UI ---------- */
var panel=document.getElementById('panel'),sw=document.getElementById('sw'),cc=document.getElementById('cc'),mg=document.getElementById('mg'),mv=document.getElementById('mv');
document.getElementById('st').addEventListener('click',function(){panel.classList.toggle('open');});
var SWATCHES=[['#FFFFFF','Weiß'],['#FF7816','Orange'],['#F7F2EA','Creme'],['#BFE3FF','Eisblau']];
SWATCHES.forEach(function(s){var b=document.createElement('button');b.style.background=s[0];b.title=s[1];b.dataset.c=s[0];b.addEventListener('click',function(){SET.glow=s[0];applySet();});sw.insertBefore(b,cc);});
cc.addEventListener('input',function(){SET.glow=cc.value.toUpperCase();applySet();});
mg.addEventListener('input',function(){SET.margin=+mg.value;applySet();});
function applySet(){saveSet();buildHole();var bs=sw.querySelectorAll('button');for(var i=0;i<bs.length;i++)bs[i].classList.toggle('on',bs[i].dataset.c.toUpperCase()===SET.glow.toUpperCase());cc.value=SET.glow.length===7?SET.glow:'#FFFFFF';mg.value=SET.margin;mv.textContent=SET.margin;if(!playing)render(time);}
applySet();
})();
</script>
