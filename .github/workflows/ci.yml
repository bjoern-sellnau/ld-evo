# Automatische Prüfung bei jedem Push und Pull Request (Befehle wie lokal, siehe CLAUDE.md).
#  1. check    — Formatierung, ESLint, TypeScript, Unit- und Logo-Pixeltests (schnell, blockiert alles Weitere)
#  2. browser  — gegen einen echten Server mit frischem Build und frischer DB, je Suite ein eigener Job:
#                e2e (LD Flow), a11y (axe), pages (Pixelvergleich), perf (Ladezeit-Budgets)
# Frischer Build je Suite ist Absicht: `next start` schreibt revalidierte Seiten nach .next zurück.
#  3. docker   — baut das Image (Dockerfile), startet es mit leerem Volume und prüft /health, Site und Sicherung
#  4. referenzbilder — nur manuell (Actions → CI → Run workflow, Haken „Referenzbilder erneuern“): erzeugt die
#                Seiten-Referenzbilder für diese Umgebung (tests/visual-pages/baseline/ci/) und committet sie auf den
#                gewählten Branch. Nur nach gewollten Design-Änderungen oder einem Browser-Update nutzen.
name: CI

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:
    inputs:
      referenzbilder:
        description: 'Referenzbilder der Seiten für die CI-Umgebung neu erzeugen und committen'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_NO_WARNINGS: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  PIXEL_ENV: ci

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Formatierung (Prettier)
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit-Tests
        run: npm test
      - name: Pixeltests Logo
        run: npm run test:visual

  browser:
    needs: check
    if: ${{ !inputs.referenzbilder }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [e2e, a11y, pages, perf]
    env:
      LDFLOW_DB: ${{ github.workspace }}/.ci-data/flow.db
      LDFLOW_SCHEDULER_INTERVAL_MS: '2000'
      SHOTS: ${{ github.workspace }}/.ci-shots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Server starten (frische DB)
        run: |
          mkdir -p .ci-data "$SHOTS"
          nohup npx next start -p 3123 > .ci-data/server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3123/ && exit 0
            sleep 1
          done
          cat .ci-data/server.log
          exit 1
      - name: test:${{ matrix.suite }}
        run: npm run test:${{ matrix.suite }}
      - name: Server-Log
        if: failure()
        run: tail -n 200 .ci-data/server.log
      - name: Differenzbilder und Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}-ergebnisse
          path: |
            tests/visual-pages/diff/
            .ci-shots/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    needs: check
    if: ${{ !inputs.referenzbilder }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build -t ld-evo:ci .
      - name: Starten und auf „healthy“ warten
        run: |
          docker run -d --name ld -p 127.0.0.1:3000:3000 -v ld-data:/data ld-evo:ci
          for i in $(seq 1 60); do
            s=$(docker inspect -f '{{.State.Health.Status}}' ld)
            [ "$s" = healthy ] && exit 0
            sleep 2
          done
          docker logs ld
          exit 1
      - name: Prüfen (Health, Site, LD Flow, Nutzer, Sicherung)
        run: |
          set -e
          curl -sf http://127.0.0.1:3000/health | grep -q '"ok"'
          curl -sf http://127.0.0.1:3000/ | grep -q 'loona'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/flow/setup)" = 200
          test "$(docker exec ld id -un)" = node
          docker exec ld test -s /data/flow-setup-token.txt
          docker exec ld node scripts/backup-db.mjs
          docker exec ld sh -c 'ls /backup/flow-*.db'
      - name: Container-Log
        if: always()
        run: docker logs ld 2>&1 | tail -n 100

  referenzbilder:
    if: ${{ inputs.referenzbilder }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      LDFLOW_DB: ${{ github.workspace }}/.ci-data/flow.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Server starten (frische DB)
        run: |
          mkdir -p .ci-data
          nohup npx next start -p 3123 > .ci-data/server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3123/ && exit 0
            sleep 1
          done
          cat .ci-data/server.log
          exit 1
      - name: Referenzbilder erzeugen
        run: UPDATE=1 npm run test:pages
      - name: Committen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/visual-pages/baseline/ci
          if git diff --cached --quiet; then echo 'Keine Änderungen.'; exit 0; fi
          git commit -m 'Referenzbilder (CI-Umgebung) erneuert'
          git push
