<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Björn Sellnau — Reel</title>
<link rel="stylesheet" href="fonts.css" />
<style>
  html,body{margin:0;background:#000}
  canvas{display:block;width:540px;height:960px}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* Intro-Reel „Björn Sellnau“ — 1080×1920, 30 fps, 112 BPM. Fakten: loona-designs.de (Startseite, Über mich,
   Portfolio, Stand 10/2026) und die Inhalte der neuen Website (content/*.ts). render(t) zeichnet Bild t (s). */
const W = 1080, H = 1920;
const BPM = 112, B = 60 / BPM, BAR = 4 * B;
const DUR = 16 * BAR + 1.7; // 16 Takte + Ausklang
const cv = document.getElementById('c');
const g = cv.getContext('2d');

const C = {
  bg: '#07090E', ink: '#F2F5FA', soft: '#9AA7BA', mute: '#5F6B7E',
  amber: '#FFB224', orange: '#FF7A2F', deep: '#FF7816', tileInk: '#171310',
};
const SG = '"Space Grotesk"', IS = '"Instrument Sans"', JM = '"JetBrains Mono"';

/* ---------- Helfer ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (x) => 1 - Math.pow(1 - x, 3);
const eIn = (x) => x * x * x;
const eIO = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const hash = (n) => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
const bar = (n) => n * BAR;
const beatPulse = (t, from = 0, to = 1e9, k = 7) => {
  if (t < from || t > to) return 0;
  const p = ((t % B) + B) % B;
  return Math.exp(-p * k);
};

function font(size, weight = 700, fam = SG) { return `${weight} ${size}px ${fam}`; }
function text(str, x, y, o = {}) {
  g.save();
  g.font = font(o.size ?? 64, o.weight ?? 700, o.fam ?? SG);
  g.fillStyle = o.color ?? C.ink;
  g.textAlign = o.align ?? 'left';
  g.textBaseline = o.base ?? 'alphabetic';
  g.globalAlpha *= o.alpha ?? 1;
  if ('letterSpacing' in g) g.letterSpacing = (o.ls ?? 0) + 'px';
  if (o.stroke) { g.strokeStyle = o.stroke; g.lineWidth = o.lw ?? 3; g.strokeText(str, x, y); }
  else g.fillText(str, x, y);
  g.restore();
}
function measure(str, size, weight = 700, fam = SG, ls = 0) {
  g.save(); g.font = font(size, weight, fam); if ('letterSpacing' in g) g.letterSpacing = ls + 'px';
  const w = g.measureText(str).width; g.restore(); return w;
}
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function imgCover(img, x, y, w, h, r = 0, top = false) {
  if (!img) return;
  const s = Math.max(w / img.width, h / img.height);
  const iw = img.width * s, ih = img.height * s;
  g.save(); rr(x, y, w, h, r); g.clip();
  g.drawImage(img, x + (w - iw) / 2, top ? y : y + (h - ih) / 2, iw, ih);
  g.restore();
}

/* LD-Zeichen (Logo-Handoff, favicon.ts): 64er-Kachel, Glyph versetzt */
const GLYPH = [new Path2D('M0 3H8V35H19L22 43H0Z'), new Path2D('M11 3H24A20 20 0 0 1 24 43H25L19 27H16V11H11ZM21 11H24A12 12 0 0 1 24 35L21 27Z')];
function ldTile(cx, cy, size, bgc = C.tileInk, fg = C.deep, alpha = 1) {
  const s = size / 64;
  g.save(); g.globalAlpha *= alpha; g.translate(cx - size / 2, cy - size / 2); g.scale(s, s);
  g.fillStyle = bgc; rr(0, 0, 64, 64, 14); g.fill();
  g.translate(9.6, 12.6); g.scale(1.018, 1.018); g.fillStyle = fg;
  g.fill(GLYPH[0]); g.fill(GLYPH[1], 'evenodd');
  g.restore();
}

/* Bilder */
const IMG = {};
const SRC = {
  alt: 'assets/alte-startseite.webp', yayci: 'assets/old_yayci.webp', ld2006: 'assets/old_ld2006.webp',
  ld2006b: 'assets/old_ld2006b.webp', catt: 'assets/old_catt2005.webp', cattshop: 'assets/old_cattshop.webp',
  mobHome: 'assets/mob_home.png', mobStory: 'assets/mob_story.png', mobBeyond: 'assets/mob_ldbeyond.png',
  deskAurum: 'assets/desk_aurum.png', deskViola: 'assets/desk_viola.png', deskLabs: 'assets/desk_labs.png',
};
const loadAll = () => Promise.all(Object.entries(SRC).map(([k, s]) => new Promise((res) => {
  const i = new Image(); i.onload = () => { IMG[k] = i; res(); }; i.onerror = () => res(); i.src = s;
})));

/* Körnung */
const grain = document.createElement('canvas'); grain.width = grain.height = 256;
{ const gx = grain.getContext('2d'); const d = gx.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.floor(hash(i * 0.37 + 1) * 255); d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  gx.putImageData(d, 0, 0); }

/* ---------- Hintergrund ---------- */
function background(t, warm = 1, hue = 'amber') {
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  // weiche Lichtflecken (Aurora)
  const blobs = hue === 'violet'
    ? [['rgba(124,58,237,', 0.22], ['rgba(236,72,153,', 0.12], ['rgba(56,189,248,', 0.08]]
    : [['rgba(255,122,47,', 0.20], ['rgba(255,178,36,', 0.14], ['rgba(190,24,93,', 0.07]];
  blobs.forEach(([c, a], i) => {
    const x = W * (0.5 + 0.38 * Math.sin(t * 0.21 + i * 2.1));
    const y = H * (0.45 + 0.32 * Math.cos(t * 0.17 + i * 1.7));
    const r = 700 + 160 * Math.sin(t * 0.3 + i);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, c + a * warm + ')'); gr.addColorStop(1, c + '0)');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  });
  // Staub
  for (let i = 0; i < 70; i++) {
    const px = (hash(i) * W + t * (8 + hash(i + 9) * 20)) % W;
    const py = (hash(i + 3) * H - t * (14 + hash(i + 5) * 30) + H * 10) % H;
    g.fillStyle = `rgba(255,214,150,${0.08 + 0.25 * hash(i + 7)})`;
    g.fillRect(px, py, 2 + hash(i + 1) * 2, 2 + hash(i + 1) * 2);
  }
}
function finish(t) {
  // Vignette + Körnung
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  g.save(); g.globalAlpha = 0.07; g.globalCompositeOperation = 'overlay';
  const ox = Math.floor(hash(Math.floor(t * 30)) * 256), oy = Math.floor(hash(Math.floor(t * 30) + 4) * 256);
  for (let y = -oy; y < H; y += 256) for (let x = -ox; x < W; x += 256) g.drawImage(grain, x, y);
  g.restore();
}
/* Glitch: Streifen versetzen + Farbsaum */
const buf = document.createElement('canvas'); buf.width = W; buf.height = H; const bg2 = buf.getContext('2d');
function glitch(amount, seed) {
  if (amount <= 0) return;
  bg2.clearRect(0, 0, W, H); bg2.drawImage(cv, 0, 0);
  const n = 14;
  for (let i = 0; i < n; i++) {
    const y = Math.floor(hash(seed + i) * H), h = 10 + Math.floor(hash(seed + i + 50) * 120 * amount);
    const dx = (hash(seed + i + 99) - 0.5) * 220 * amount;
    g.drawImage(buf, 0, y, W, h, dx, y, W, h);
  }
  g.save(); g.globalCompositeOperation = 'screen'; g.globalAlpha = 0.5 * amount;
  g.filter = 'none';
  g.drawImage(buf, 12 * amount, 0); g.globalCompositeOperation = 'multiply'; g.restore();
  g.fillStyle = `rgba(255,122,47,${0.15 * amount})`;
  g.fillRect(0, Math.floor(hash(seed + 7) * H), W, 6 + 20 * amount);
}
function flash(a, col = '255,240,220') { if (a > 0) { g.fillStyle = `rgba(${col},${a})`; g.fillRect(0, 0, W, H); } }
function kicker(str, x, y, a = 1, col = C.amber) { text(str, x, y, { size: 30, weight: 500, fam: JM, color: col, ls: 6, alpha: a }); }

/* ---------- Szene 1: Terminal ---------- */
function scene1(t) {
  background(t, 0.25 + 0.6 * seg(t, 2.6, 4.2));
  const x0 = 110, y0 = 880, lh = 70;
  const typed = (s, a, b) => s.slice(0, Math.floor(s.length * seg(t, a, b)));
  const lines = [];
  lines.push(['❯ ', typed('whoami', 0.55, 1.15), C.ink]);
  if (t > 1.45) lines.push(['', 'bjoern-sellnau', C.amber]);
  if (t > 1.75) lines.push(['❯ ', typed('cat ~/about.txt', 1.85, 2.6), C.ink]);
  if (t > 2.85) lines.push(['', 'Web Engineer seit 2007 · Berlin', C.soft]);
  if (t > 3.15) lines.push(['', 'React · Next.js · TypeScript · Node', C.soft]);
  // Fenster
  const a = eOut(seg(t, 0.15, 0.6));
  g.save(); g.globalAlpha = a;
  g.translate(0, (1 - a) * 40);
  g.fillStyle = 'rgba(14,17,26,0.92)'; rr(70, 720, W - 140, 560, 28); g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.12)'; g.lineWidth = 2; g.stroke();
  ['#ff5f57', '#febc2e', '#28c840'].forEach((c, i) => { g.fillStyle = c; g.beginPath(); g.arc(120 + i * 36, 770, 11, 0, 7); g.fill(); });
  text('zsh — loona-designs', W / 2, 780, { size: 28, weight: 500, fam: JM, color: C.mute, align: 'center' });
  lines.forEach(([p, s, col], i) => {
    const y = y0 + i * lh;
    text(p, x0, y, { size: 40, weight: 600, fam: JM, color: C.orange });
    text(s, x0 + (p ? 52 : 0), y, { size: 40, weight: 500, fam: JM, color: col });
    if (i === lines.length - 1 && Math.floor(t * 3) % 2 === 0) {
      const w = measure(s, 40, 500, JM);
      g.fillStyle = C.amber; g.fillRect(x0 + (p ? 52 : 0) + w + 6, y - 34, 22, 42);
    }
  });
  g.restore();
  kicker('LOONA! DESIGNS  ///  INTRO', 110, 640, a * 0.8);
  // Aufbau zum Drop
  const gl = seg(t, 3.55, bar(2));
  if (gl > 0) { glitch(gl * 1.2, Math.floor(t * 30)); flash(eIn(gl) * 0.85); }
}

/* ---------- Szene 2: Name ---------- */
function scene2(t) {
  const lt = t - bar(2);
  background(t, 1 + beatPulse(t) * 0.6);
  flash(Math.max(0, 0.9 - lt * 2.2));
  // großer Name, Buchstaben steigen gestaffelt auf
  const rise = (str, x, y, size, delay, col, outline) => {
    let cx = x;
    for (let i = 0; i < str.length; i++) {
      const ch = str[i];
      const k = eBack(seg(lt, delay + i * 0.035, delay + i * 0.035 + 0.45));
      const w = measure(ch, size, 700, SG, -6);
      text(ch, cx, y + (1 - k) * 160, { size, weight: 700, color: col, alpha: clamp(k * 1.2), ls: -6, stroke: outline ? col : undefined, lw: 4 });
      cx += w;
    }
  };
  kicker('/// THE WEB. MY PASSION', 90, 640, eOut(seg(lt, 0.25, 0.7)));
  rise('Björn', 80, 860, 250, 0.05, C.ink);
  rise('Sellnau.', 80, 1090, 250, 0.3, C.amber);
  // Rolle
  const r = eOut(seg(lt, 1.1, 1.6));
  g.fillStyle = `rgba(255,178,36,${0.9 * r})`; g.fillRect(90, 1170, 520 * r, 6);
  text('Senior Full-Stack /', 90, 1260, { size: 62, weight: 600, fam: IS, alpha: r });
  text('Software Engineer', 90, 1340, { size: 62, weight: 600, fam: IS, alpha: eOut(seg(lt, 1.25, 1.75)) });
  // Chips auf den Beats
  const chips = ['Berlin', 'React & Web', 'seit 2007'];
  let cx = 90;
  chips.forEach((c, i) => {
    const k = eBack(seg(lt, 2.2 + i * B * 0.5, 2.5 + i * B * 0.5));
    const w = measure(c, 38, 600, IS) + 64;
    g.save(); g.globalAlpha = clamp(k); g.translate(cx + w / 2, 1460); g.scale(k, k);
    g.fillStyle = 'rgba(255,255,255,0.06)'; rr(-w / 2, -44, w, 88, 44); g.fill();
    g.strokeStyle = 'rgba(255,178,36,0.45)'; g.lineWidth = 2; g.stroke();
    text(c, 0, 13, { size: 38, weight: 600, fam: IS, align: 'center' });
    g.restore(); cx += w + 20;
  });
  ldTile(W - 170, 330, 150, C.tileInk, C.deep, eOut(seg(lt, 0.6, 1.1)));
  // Ausgang
  const out = seg(t, bar(4) - 0.3, bar(4));
  if (out > 0) { glitch(out, Math.floor(t * 30) + 400); }
}

/* ---------- Szene 3: Stack, ein Wort pro Beat ---------- */
const STACK = ['React', 'Next.js', 'TypeScript', 'Node.js', 'React Native', 'GraphQL', 'Stripe', 'Claude Code'];
function scene3(t) {
  const lt = t - bar(4);
  background(t, 0.8 + beatPulse(t) * 0.8);
  const idx = clamp(Math.floor(lt / B), 0, STACK.length - 1);
  const inBeat = (lt - idx * B) / B;
  // bisherige Wörter als Liste oben
  for (let i = 0; i < idx; i++) {
    text(STACK[i], 90, 330 + i * 78, { size: 58, weight: 600, fam: SG, color: i % 2 ? C.soft : C.mute, alpha: 0.9 });
  }
  // aktuelles Wort riesig
  const w = STACK[idx];
  let size = 230; while (measure(w, size, 700, SG, -8) > W - 160) size -= 6;
  const k = eOut(clamp(inBeat * 3));
  const outline = idx % 3 === 1;
  g.save(); g.translate(W / 2, 1180); g.scale(lerp(1.25, 1, k), lerp(1.25, 1, k));
  text(w, 0, 0, { size, weight: 700, align: 'center', ls: -8, color: idx % 2 ? C.amber : C.ink, stroke: outline ? (idx % 2 ? C.amber : C.ink) : undefined, lw: 5, alpha: clamp(k * 1.5) });
  g.restore();
  kicker(`STACK  ${String(idx + 1).padStart(2, '0')}/${STACK.length}`, 90, 1450);
  g.fillStyle = 'rgba(255,255,255,0.1)'; g.fillRect(90, 1480, W - 180, 4);
  g.fillStyle = C.amber; g.fillRect(90, 1480, (W - 180) * clamp(lt / (8 * B)), 4);
  flash(beatPulse(t, bar(4), bar(6), 14) * 0.18);
}

/* ---------- Szene 4: Sekundenzähler ---------- */
const SECONDS = 604238400; // 01.09.2007 → 24.10.2026 (wie der Zähler auf der Startseite)
function scene4(t) {
  const lt = t - bar(6);
  background(t, 1);
  flash(Math.max(0, 0.5 - lt * 2));
  kicker('SEIT SEPTEMBER 2007', 90, 620, eOut(seg(lt, 0.1, 0.5)));
  const p = eIO(seg(lt, 0.2, 2.6));
  const v = Math.floor(SECONDS * p);
  const s = v.toLocaleString('de-DE');
  let size = 168; while (measure(s, size, 700, JM) > W - 150) size -= 4;
  // Ziffern mit Rollbewegung
  let x = 90;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    const wob = p < 1 && /\d/.test(ch) ? Math.sin(t * 40 + i) * 6 * (1 - p) : 0;
    text(ch, x, 820 + wob, { size, weight: 700, fam: JM, color: i < s.length - 3 ? C.ink : C.amber });
    x += measure(ch, size, 700, JM);
  }
  text('Sekunden im Dienst des Webs.', 90, 920, { size: 52, weight: 600, fam: IS, color: C.soft, alpha: eOut(seg(lt, 0.6, 1.1)) });
  const stats = [['18+', 'Jahre Web'], ['10', 'Zertifikate'], ['∞', 'Neugier']];
  stats.forEach(([n, l], i) => {
    const k = eBack(seg(lt, 2.0 + i * B, 2.3 + i * B));
    const y = 1130 + i * 190;
    g.save(); g.globalAlpha = clamp(k); g.translate((1 - k) * -120, 0);
    text(n, 90, y, { size: 150, weight: 700, color: i === 0 ? C.amber : C.ink, ls: -4 });
    text(l, 90 + measure(n, 150, 700, SG, -4) + 30, y - 18, { size: 56, weight: 600, fam: IS, color: C.soft });
    g.restore();
  });
  const out = seg(t, bar(8) - 0.25, bar(8));
  if (out > 0) glitch(out, Math.floor(t * 30) + 800);
}

/* ---------- Szene 5: Reise 2002 → 2026 ---------- */
const JOURNEY = [
  [2002, 'Ausbildung', 'Staatl. geprüfter Technischer Assistent für Informatik', null],
  [2003, 'Flash-Game', 'Covert Operations Tournament — Flash 5', null],
  [2004, 'Onlineshop', 'Computer Handel Yayci', 'yayci'],
  [2006, 'Loona! Designs', 'ld2006 — Flash & ActionScript', 'ld2006'],
  [2007, 'PIXELTEX GmbH', 'Web Engineer · Hannover, ab 2011 Berlin', null],
  [2016, 'OpenBooking', 'Frontend Lead Developer & Mobile Solutions', null],
  [2019, 'IHK Berlin', 'Ausbilder nach AEVO — Fachinformatiker', null],
  [2020, 'Code-b', 'Software Engineer — React', null],
  [2026, 'Materna', 'Senior Developer · Public Sector · E-Government · Zoll', null],
];
function scene5(t) {
  const t0 = bar(8), span = 3 * BAR, per = span / JOURNEY.length;
  const lt = t - t0;
  background(t, 0.9);
  kicker('DIE REISE', 90, 300, 1);
  const i = clamp(Math.floor(lt / per), 0, JOURNEY.length - 1);
  const f = (lt - i * per) / per;
  const [year, title, sub, img] = JOURNEY[i];
  // Zeitleiste links
  g.fillStyle = 'rgba(255,255,255,0.12)'; g.fillRect(96, 360, 4, 1320);
  JOURNEY.forEach(([y], j) => {
    const yy = 380 + j * 160 - i * 0 ;
    const on = j <= i;
    g.fillStyle = on ? C.amber : 'rgba(255,255,255,0.25)';
    g.beginPath(); g.arc(98, yy, j === i ? 14 : 8, 0, 7); g.fill();
    text(String(y), 140, yy + 12, { size: 34, weight: 600, fam: JM, color: j === i ? C.amber : on ? C.soft : C.mute });
  });
  // Bild der Station (Originalscreenshot)
  if (img && IMG[img]) {
    const k = eOut(clamp(f * 2.2));
    g.save(); g.translate(640, 760); g.rotate((-4 + 8 * hash(i)) * Math.PI / 180); g.globalAlpha = k;
    g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowBlur = 50;
    imgCover(IMG[img], -330, -230 + (1 - k) * 60, 660, 460, 22, true);
    g.restore();
  }
  // große Jahreszahl + Text
  const k = eOut(clamp(f * 3));
  const ys = img ? 1240 : 900;
  text(String(year), 300, ys + 120, { size: 230, weight: 700, color: C.ink, ls: -10, alpha: k });
  text(String(year), 300 + (1 - k) * 30, ys + 120, { size: 230, weight: 700, color: 'rgba(0,0,0,0)', stroke: C.amber, lw: 3, ls: -10, alpha: 0.5 * k });
  text(title, 304, ys + 210, { size: 66, weight: 700, fam: IS, color: C.amber, alpha: k });
  // Untertitel umbrechen
  const words = sub.split(' '); let line = '', ly = ys + 280;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (measure(test, 42, 500, IS) > W - 380) { text(line, 304, ly, { size: 42, weight: 500, fam: IS, color: C.soft, alpha: k }); line = w; ly += 56; }
    else line = test;
  }
  text(line, 304, ly, { size: 42, weight: 500, fam: IS, color: C.soft, alpha: k });
  flash((1 - clamp(f * 6)) * 0.12);
  const out = seg(t, bar(11) - 0.2, bar(11));
  if (out > 0) glitch(out, Math.floor(t * 30) + 1200);
}

/* ---------- Szene 6: Zertifikate ---------- */
const CERTS = [
  ['Claude Code in Action', 'Anthropic · 03/2026'],
  ['Introduction to Agent Skills', 'Anthropic · 03/2026'],
  ['KI-Spezialist im Unternehmen', 'Scaly Academy · 11/2025'],
  ['Stripe Certified Professional Developer', 'Stripe · 12/2024'],
  ['Stripe Certified Billing Developer', 'Stripe · 12/2024'],
  ['Stripe Certified Associate Developer', 'Stripe · 12/2024'],
  ['Ausbilder nach AEVO', 'IHK Berlin · 03/2019'],
  ['StrongLoop Certified Node Developer', 'IBM · 08/2015'],
  ['Adobe Certified Expert — ColdFusion 8', 'Adobe · 06/2010'],
];
function scene6(t) {
  const lt = t - bar(11);
  background(t, 0.9);
  flash(Math.max(0, 0.4 - lt * 2));
  kicker('ZERTIFIZIERT', 90, 330, 1);
  text('Lernen hört', 90, 470, { size: 110, weight: 700, ls: -4, alpha: eOut(seg(lt, 0, 0.3)) });
  text('nie auf.', 90, 585, { size: 110, weight: 700, ls: -4, color: C.amber, alpha: eOut(seg(lt, 0.1, 0.4)) });
  CERTS.forEach(([n, m], i) => {
    const k = eBack(seg(lt, 0.3 + i * B * 0.25, 0.6 + i * B * 0.25));
    const y = 650 + i * 104;
    g.save(); g.globalAlpha = clamp(k); g.translate((1 - k) * 200, 0);
    g.fillStyle = 'rgba(255,255,255,0.05)'; rr(90, y, W - 180, 92, 20); g.fill();
    g.strokeStyle = i < 2 ? 'rgba(255,178,36,0.6)' : 'rgba(255,255,255,0.1)'; g.lineWidth = 2; g.stroke();
    text('✓', 130, y + 62, { size: 44, weight: 700, fam: JM, color: C.amber });
    text(n, 190, y + 44, { size: 34, weight: 600, fam: IS });
    text(m, 190, y + 78, { size: 24, weight: 500, fam: JM, color: C.mute });
    g.restore();
  });
}

/* ---------- Szene 7: Labs ---------- */
const LABS = [
  ['CF', 'Corefall', '6D-Shooter à la Descent', '#C2410C'],
  ['CO', 'Covert Operations', 'Top-Down, ISO & FPS', '#14532D'],
  ['CA', 'Covert Operations Arena', 'FPS', '#7F1D1D'],
  ['DG', 'Death Grid 3D', 'Retro-Shooter wie Doom', '#27272A'],
  ['WB', 'LD WorkBench', 'Timesheet & Notizen', '#B45309'],
  ['LB', 'LD Buddy', 'Finanzen, Bestellungen & mehr', '#4C1D95'],
];
function scene7(t) {
  const lt = t - bar(12);
  background(t, 0.7, 'violet');
  flash(Math.max(0, 0.5 - lt * 2.4), '235,220,255');
  kicker('LABS 2026  ///  KI-EXPERIMENTE', 90, 300, 1, '#C4B5FD');
  text('Gebaut mit', 90, 430, { size: 96, weight: 700, ls: -4, alpha: eOut(seg(lt, 0, 0.3)) });
  text('Claude Code.', 90, 535, { size: 96, weight: 700, ls: -4, color: '#C4B5FD', alpha: eOut(seg(lt, 0.15, 0.45)) });
  LABS.forEach(([mono, name, desc, col], i) => {
    const k = eOut(seg(lt, 0.5 + i * B * 0.5, 1.0 + i * B * 0.5));
    const row = Math.floor(i / 2), colI = i % 2;
    const w = 430, h = 250, x = 90 + colI * (w + 40), y = 620 + row * (h + 34);
    const drift = Math.sin(t * 1.2 + i) * 6;
    g.save(); g.globalAlpha = clamp(k * 1.3); g.translate(x + w / 2, y + h / 2 + (1 - k) * 220 + drift); g.rotate((1 - k) * (colI ? 0.2 : -0.2));
    g.shadowColor = 'rgba(0,0,0,0.5)'; g.shadowBlur = 40;
    g.fillStyle = col; rr(-w / 2, -h / 2, w, h, 30); g.fill(); g.shadowBlur = 0;
    // Streifenmuster
    g.save(); rr(-w / 2, -h / 2, w, h, 30); g.clip(); g.strokeStyle = 'rgba(255,255,255,0.06)'; g.lineWidth = 14;
    for (let s = -w; s < w * 2; s += 40) { g.beginPath(); g.moveTo(-w / 2 + s, -h / 2); g.lineTo(-w / 2 + s - h, h / 2); g.stroke(); }
    g.restore();
    text(mono, -w / 2 + 34, -h / 2 + 108, { size: 100, weight: 700, color: 'rgba(255,255,255,0.92)', ls: -4 });
    text(name, -w / 2 + 34, h / 2 - 76, { size: 36, weight: 700, fam: IS });
    text(desc, -w / 2 + 34, h / 2 - 34, { size: 26, weight: 500, fam: IS, color: 'rgba(255,255,255,0.75)' });
    g.restore();
  });
  text('Claude Code · Opus 4.5–4.8 · Claude Design · Antigravity 2', W / 2, 1530, { size: 28, weight: 500, fam: JM, color: C.soft, align: 'center', alpha: eOut(seg(lt, 2.2, 2.6)) });
  const out = seg(t, bar(14) - 0.25, bar(14));
  if (out > 0) glitch(out, Math.floor(t * 30) + 1600);
}

/* ---------- Szene 8: LD Beyond (neue Website) ---------- */
function phone(img, cx, cy, w, scroll, alpha = 1) {
  const h = w * 2.06;
  g.save(); g.globalAlpha = alpha;
  g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowBlur = 60;
  g.fillStyle = '#0B0D12'; rr(cx - w / 2 - 16, cy - h / 2 - 16, w + 32, h + 32, 70); g.fill(); g.shadowBlur = 0;
  g.strokeStyle = 'rgba(255,255,255,0.18)'; g.lineWidth = 3; g.stroke();
  if (img) {
    g.save(); rr(cx - w / 2, cy - h / 2, w, h, 56); g.clip();
    const s = w / img.width; const ih = img.height * s;
    g.drawImage(img, cx - w / 2, cy - h / 2 - scroll * Math.max(0, ih - h), w, ih);
    g.restore();
  }
  g.fillStyle = '#000'; rr(cx - 70, cy - h / 2 + 14, 140, 38, 19); g.fill();
  g.restore();
}

  phone(IMG.mobBeyond, 780, 1460, 300, 0, eOut(seg(lt, 0.55, 1.0)));

  chips.forEach((c, i) => {

}

/* ---------- Szene 9: Outro ---------- */
function scene9(t) {
  const lt = t - bar(15);
  background(t, 0.9);
  flash(Math.max(0, 0.8 - lt * 2.2));
  // Ereignishorizont-Ring hinter dem Logo
  const k = eOut(seg(lt, 0.0, 0.8));
  const cx = W / 2, cy = 560, R = 240 * k;
  if (R > 1) {
    const ring = g.createRadialGradient(cx, cy, R * 0.8, cx, cy, R * 1.6);
    ring.addColorStop(0, 'rgba(255,178,36,0)'); ring.addColorStop(0.25, 'rgba(255,190,90,0.9)');
    ring.addColorStop(0.45, 'rgba(255,122,47,0.35)'); ring.addColorStop(1, 'rgba(255,122,47,0)');
    g.fillStyle = ring; g.fillRect(0, 0, W, H);
    // Scheibe
    g.save(); g.translate(cx, cy + 10); g.scale(1, 0.16);
    const disk = g.createRadialGradient(0, 0, R * 1.1, 0, 0, R * 2.6);
    disk.addColorStop(0, 'rgba(255,220,160,0.9)'); disk.addColorStop(1, 'rgba(255,122,47,0)');
    g.fillStyle = disk; g.beginPath(); g.arc(0, 0, R * 2.6, 0, 7); g.fill(); g.restore();
    g.fillStyle = '#030303'; g.beginPath(); g.arc(cx, cy, R * 0.92, 0, 7); g.fill();
  }
  ldTile(cx, cy, 220 * eBack(seg(lt, 0.3, 0.9)), C.tileInk, C.deep, clamp(seg(lt, 0.3, 0.6)));
  text('Das Web.', W / 2, 1010, { size: 120, weight: 700, align: 'center', ls: -4, alpha: eOut(seg(lt, 0.7, 1.1)) });
  text('Meine Leidenschaft.', W / 2, 1130, { size: 104, weight: 700, align: 'center', ls: -4, color: C.amber, alpha: eOut(seg(lt, 0.9, 1.3)) });
  text('Björn Sellnau', W / 2, 1250, { size: 52, weight: 600, fam: IS, align: 'center', alpha: eOut(seg(lt, 1.3, 1.7)) });
  text('loona-designs.de', W / 2, 1340, { size: 44, weight: 600, fam: JM, align: 'center', color: C.amber, alpha: eOut(seg(lt, 1.5, 1.9)) });
  text('linkedin.com/in/bjoern-sellnau', W / 2, 1420, { size: 30, weight: 500, fam: JM, align: 'center', color: C.soft, alpha: eOut(seg(lt, 1.7, 2.1)) });
  text('github.com/bjoern-sellnau', W / 2, 1468, { size: 30, weight: 500, fam: JM, align: 'center', color: C.soft, alpha: eOut(seg(lt, 1.8, 2.2)) });
  // Ausblende
  const end = seg(t, DUR - 0.9, DUR);
  if (end > 0) { g.fillStyle = `rgba(0,0,0,${eIn(end)})`; g.fillRect(0, 0, W, H); }
}

function render(t) {
  g.save();
  if (t < bar(2)) scene1(t);
  else if (t < bar(4)) scene2(t);
  else if (t < bar(6)) scene3(t);
  else if (t < bar(8)) scene4(t);
  else if (t < bar(11)) scene5(t);
  else if (t < bar(12)) scene6(t);
  else if (t < bar(14)) scene7(t);
  else if (t < bar(15)) scene8(t);
  else scene9(t);
  g.restore();
  finish(t);
}

/* ---------- Musik (Web Audio, offline gerendert) ---------- */
async function music() {
  const SR = 48000, len = Math.ceil(DUR * SR);
  const ac = new OfflineAudioContext(2, len, SR);
  const master = ac.createGain(); master.gain.value = 0.5;
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 8; comp.attack.value = 0.003; comp.release.value = 0.15;
  const out = ac.createGain(); out.gain.value = 0.85;
  master.connect(comp); comp.connect(out); out.connect(ac.destination);
  const noiseBuf = ac.createBuffer(1, SR * 2, SR); { const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = hash(i * 0.731) * 2 - 1; }
  const noise = (t, dur, f0, f1, gain, type = 'highpass', q = 0.7) => {
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const gg = ac.createGain(); gg.gain.setValueAtTime(gain, t); gg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(gg); gg.connect(master); s.start(t); s.stop(t + dur + 0.05);
  };
  const ramp = (t, dur, gain) => { // Riser
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 2; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(6000, t + dur);
    const gg = ac.createGain(); gg.gain.setValueAtTime(0.0001, t); gg.gain.exponentialRampToValueAtTime(gain, t + dur);
    s.connect(f); f.connect(gg); gg.connect(master); s.start(t); s.stop(t + dur);
  };
  const kick = (t, g0 = 1) => {
    const o = ac.createOscillator(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.18);
    const gg = ac.createGain(); gg.gain.setValueAtTime(g0, t); gg.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
    o.connect(gg); gg.connect(master); o.start(t); o.stop(t + 0.45);
  };
  const boom = (t) => { kick(t, 1.3); noise(t, 1.6, 900, 80, 0.5, 'lowpass'); };
  const tone = (t, dur, freq, type, gain, cutoff, dest = master, detune = 0) => {
    const o = ac.createOscillator(); o.type = type; o.frequency.value = freq; o.detune.value = detune;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
    const gg = ac.createGain(); gg.gain.setValueAtTime(0.0001, t); gg.gain.exponentialRampToValueAtTime(gain, t + 0.02); gg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(gg); gg.connect(dest); o.start(t); o.stop(t + dur + 0.05);
  };
  const midi = (n) => 440 * Math.pow(2, (n - 69) / 12);
  // Akkorde je Takt: Am – F – C – G
  const CH = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
  const ROOT = [45, 41, 48, 43];
  for (let b = 0; b < 16; b++) {
    const t0 = bar(b), ch = CH[b % 4];
    // Fläche
    ch.forEach((n) => { tone(t0, BAR + 0.6, midi(n), 'sawtooth', 0.035, 1400, master, -7); tone(t0, BAR + 0.6, midi(n), 'sawtooth', 0.035, 1400, master, 7); });
    if (b >= 2 && b < 15) {
      for (let k = 0; k < 4; k++) {
        const tb = t0 + k * B;
        kick(tb);
        noise(tb + B / 2, 0.06, 7000, 9000, b >= 4 ? 0.18 : 0.08);
        if (b >= 4) noise(tb + B / 4 * 3, 0.03, 8000, 9000, 0.06);
        if (k % 2 === 1 && b >= 4) noise(tb, 0.18, 1800, 400, 0.22, 'bandpass', 0.8); // Clap
        // Bass in Achteln
        for (let e = 0; e < 2; e++) tone(tb + e * B / 2 + 0.03, B / 2 - 0.04, midi(ROOT[b % 4] - 12 + (e ? 12 : 0)), 'sawtooth', 0.16, 420);
      }
      // Arpeggio ab Takt 4
      if (b >= 4) for (let s = 0; s < 8; s++) tone(t0 + s * B / 2, B / 2, midi(ch[s % 3] + 12 + (s > 3 ? 12 : 0)), 'square', 0.03, 2600);
    }
  }
  // Tippgeräusche im Terminal
  const typing = [[0.55, 1.15, 6], [1.85, 2.6, 15]];
  typing.forEach(([a, b2, n]) => { for (let i = 0; i < n; i++) noise(a + (b2 - a) * i / n, 0.03, 3000, 5000, 0.12, 'bandpass', 3); });
  ramp(2.6, bar(2) - 2.6, 0.35);
  [bar(2), bar(6), bar(8), bar(11), bar(12), bar(14), bar(15)].forEach((t) => boom(t));
  ramp(bar(14) - BAR * 0.5, BAR * 0.5, 0.25);
  // Ausklang
  ch: { const t0 = bar(16); CH[0].forEach((n) => tone(t0, 1.6, midi(n), 'triangle', 0.05, 1800)); }
  const buf = await ac.startRendering();
  // WAV 16 bit
  const L = buf.getChannelData(0), Rr = buf.getChannelData(1), n = L.length;
  const wavv = new DataView(new ArrayBuffer(44 + n * 4));
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) wavv.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); wavv.setUint32(4, 36 + n * 4, true); ws(8, 'WAVE'); ws(12, 'fmt '); wavv.setUint32(16, 16, true);
  wavv.setUint16(20, 1, true); wavv.setUint16(22, 2, true); wavv.setUint32(24, SR, true); wavv.setUint32(28, SR * 4, true);
  wavv.setUint16(32, 4, true); wavv.setUint16(34, 16, true); ws(36, 'data'); wavv.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) { wavv.setInt16(44 + i * 4, clamp(L[i], -1, 1) * 32767, true); wavv.setInt16(46 + i * 4, clamp(Rr[i], -1, 1) * 32767, true); }
  const bytes = new Uint8Array(wavv.buffer); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
